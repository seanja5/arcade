<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNAKE — ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000814; overflow: hidden; user-select: none; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const LW = 900, LH = 600;
let CW = 0, CH = 0;
function resize(){CW=canvas.width=window.innerWidth;CH=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();
const scaleX=()=>CW/LW, scaleY=()=>CH/LH;

const CLR={bg:'#000814',player:'#00f5ff',enemy:'#ff2d78',ui:'#ffe600',
           green:'#39ff14',orange:'#ff8800',purple:'#bf00ff',dim:'#1e3a5f',cursor:'#39ff14'};

const DIFFS=[
  {label:'CASUAL',  color:'#39ff14', stepFrames:10, msg:'Easy does it.'},
  {label:'VETERAN', color:'#ff8800', stepFrames:6,  msg:'Solid reflexes.'},
  {label:'NIGHTMARE',color:'#ff2d78',stepFrames:3,  msg:'Blazing fast!'},
  {label:'GODMODE', color:'#bf00ff', stepFrames:1,  msg:'Transcendent.'},
];

const GRID_COLS=30, GRID_ROWS=20;
const CELL_W=LW/GRID_COLS, CELL_H=(LH-80)/GRID_ROWS;
const GRID_TOP=60;

let gstate='MENU';
let diff=null;
let score=0, highScore=0, length=3;
let snake=[], dx=1, dy=0, ndx=1, ndy=0;
let food={x:0,y:0};
let stepTimer=0, dead=false;
let particles=[], frameCount=0;
let rawMX=CW/2,rawMY=CH/2,logMX=LW/2,logMY=LH/2;
const keys={};
const BACK_BTN={x:10,y:LH-32,w:110,h:22};
let lastKeyTime=0;

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  rawMX=e.clientX-r.left; rawMY=e.clientY-r.top;
  logMX=rawMX/scaleX(); logMY=rawMY/scaleY();
});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gstate==='MENU'){
    if(e.code==='Digit1')startGame(0);
    if(e.code==='Digit2')startGame(1);
    if(e.code==='Digit3')startGame(2);
    if(e.code==='Digit4')startGame(3);
  }
  if(gstate==='GAMEOVER'&&(e.code==='Enter'||e.code==='Space'))gstate='MENU';
  if(gstate==='PLAY'&&e.code==='Escape')gstate='MENU';

  // Direction input — prevent reversing
  const now=Date.now();
  if(now-lastKeyTime<60)return;
  if(gstate==='PLAY'){
    if((e.code==='ArrowUp'||e.code==='KeyW')&&dy===0){ndx=0;ndy=-1;lastKeyTime=now;}
    if((e.code==='ArrowDown'||e.code==='KeyS')&&dy===0){ndx=0;ndy=1;lastKeyTime=now;}
    if((e.code==='ArrowLeft'||e.code==='KeyA')&&dx===0){ndx=-1;ndy=0;lastKeyTime=now;}
    if((e.code==='ArrowRight'||e.code==='KeyD')&&dx===0){ndx=1;ndy=0;lastKeyTime=now;}
  }
});
document.addEventListener('keyup',e=>{delete keys[e.code];});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/scaleX(), my=(e.clientY-r.top)/scaleY();
  if(inBackBtn(mx,my)){window.location.href='index.html';return;}
  if(gstate==='MENU')for(let i=0;i<4;i++)if(inDiffBtn(i,mx,my))startGame(i);
  if(gstate==='GAMEOVER')gstate='MENU';
});

function inDiffBtn(i,mx,my){const bx=LW/2-160,by=248+i*62;return mx>=bx&&mx<=bx+320&&my>=by&&my<=by+48;}
function inBackBtn(mx,my){return mx>=BACK_BTN.x&&mx<=BACK_BTN.x+BACK_BTN.w&&my>=BACK_BTN.y&&my<=BACK_BTN.y+BACK_BTN.h;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function startGame(idx){
  diff=DIFFS[idx]; score=0; length=3; dead=false;
  dx=1;dy=0;ndx=1;ndy=0; stepTimer=0; particles=[];
  snake=[{x:15,y:10},{x:14,y:10},{x:13,y:10}];
  placeFood();
  gstate='PLAY';
}

function placeFood(){
  let fx,fy,ok=false;
  while(!ok){
    fx=Math.floor(Math.random()*GRID_COLS);
    fy=Math.floor(Math.random()*GRID_ROWS);
    ok=!snake.some(s=>s.x===fx&&s.y===fy);
  }
  food={x:fx,y:fy};
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const spd=rnd(1.5,5),a=rnd(0,Math.PI*2);
    particles.push({x,y,dx:Math.cos(a)*spd,dy:Math.sin(a)*spd,life:1.0,decay:rnd(0.02,0.05),r:rnd(2,5),color});
  }
}
function tickParticles(){
  particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dx*=0.93;p.dy*=0.93;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  particles.forEach(p=>{
    const r=p.r*p.life;if(r<=0)return;
    ctx.save();ctx.globalAlpha=p.life;ctx.shadowBlur=8;ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

function cellToScreen(cx,cy){
  return {x:cx*CELL_W, y:GRID_TOP+cy*CELL_H};
}

function drawGrid(){
  ctx.save(); ctx.strokeStyle='rgba(255,230,0,0.04)'; ctx.lineWidth=0.5;
  for(let x=0;x<=GRID_COLS;x++){
    ctx.beginPath(); ctx.moveTo(x*CELL_W,GRID_TOP); ctx.lineTo(x*CELL_W,GRID_TOP+GRID_ROWS*CELL_H); ctx.stroke();
  }
  for(let y=0;y<=GRID_ROWS;y++){
    ctx.beginPath(); ctx.moveTo(0,GRID_TOP+y*CELL_H); ctx.lineTo(LW,GRID_TOP+y*CELL_H); ctx.stroke();
  }
  ctx.restore();
}

function drawSnake(){
  snake.forEach((s,i)=>{
    const pos=cellToScreen(s.x,s.y);
    const isHead=i===0;
    const alpha=isHead?1:Math.max(0.2,1-i/snake.length*0.6);
    const col=isHead?CLR.ui:'#aa9900';
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=col;
    ctx.shadowBlur=isHead?18:6;
    ctx.shadowColor=CLR.ui;
    ctx.beginPath();
    ctx.roundRect(pos.x+2,pos.y+2,CELL_W-4,CELL_H-4,3);
    ctx.fill();
    if(isHead){
      // Eyes
      ctx.shadowBlur=0; ctx.fillStyle='#000';
      const ex=pos.x+CELL_W*0.3, ey=pos.y+CELL_H*0.3;
      ctx.fillRect(ex,ey,2,2);
      ctx.fillRect(ex+CELL_W*0.3,ey,2,2);
    }
    ctx.restore();
  });
}

function drawFood(){
  const pos=cellToScreen(food.x,food.y);
  const pulse=0.8+0.2*Math.sin(Date.now()/300);
  ctx.save();
  ctx.shadowBlur=16*pulse; ctx.shadowColor='#ff2d78'; ctx.fillStyle='#ff2d78';
  ctx.beginPath();
  ctx.arc(pos.x+CELL_W/2,pos.y+CELL_H/2,CELL_W*0.35*pulse,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#ffaacc';
  ctx.beginPath();
  ctx.arc(pos.x+CELL_W/2-1,pos.y+CELL_H/2-1,CELL_W*0.12,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.font='bold 18px Courier New'; ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillStyle=CLR.ui; ctx.shadowBlur=12; ctx.shadowColor=CLR.ui;
  ctx.fillText(`SCORE: ${score}`,20,34);
  ctx.textAlign='center'; ctx.fillStyle=CLR.dim; ctx.shadowColor=CLR.dim;
  ctx.fillText(`LENGTH: ${snake.length}`,LW/2,34);
  ctx.textAlign='right'; ctx.fillStyle=CLR.green; ctx.shadowColor=CLR.green;
  ctx.fillText(`BEST: ${highScore}`,LW-20,34);
  if(diff){
    ctx.font='bold 12px Courier New'; ctx.textAlign='center';
    ctx.fillStyle=diff.color; ctx.shadowColor=diff.color;
    ctx.fillText(diff.label,LW/2,14);
  }
  ctx.restore();
}

function drawScanlines(){
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#000';
  for(let y=0;y<LH;y+=3)ctx.fillRect(0,y,LW,1); ctx.restore();
}
function drawBackBtn(){
  const hov=inBackBtn(logMX,logMY);
  ctx.save(); ctx.font='bold 11px Courier New'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=hov?CLR.ui:CLR.dim; ctx.shadowBlur=hov?12:0; ctx.shadowColor=CLR.ui;
  ctx.fillText('← ARCADE',BACK_BTN.x,BACK_BTN.y+BACK_BTN.h/2); ctx.restore();
}
function drawCursor(cx,cy){
  const p=2,fg=CLR.cursor,dk=CLR.bg; ctx.save();
  ctx.translate(Math.round(cx),Math.round(cy)); ctx.shadowBlur=10; ctx.shadowColor=fg;
  const dot=(c,r,col=fg)=>{ctx.fillStyle=col;ctx.fillRect(c*p,r*p,p,p);};
  dot(-2,-6);dot(-2,-5);dot(1,-6);dot(1,-5);
  for(let c=-2;c<=2;c++)dot(c,-4);for(let c=-2;c<=2;c++)dot(c,-3);
  dot(-2,-2);dot(-1,-2,dk);dot(0,-2);dot(1,-2,dk);dot(2,-2);
  for(let c=-2;c<=2;c++)dot(c,-1);
  dot(-1,0);dot(0,0);dot(1,0);dot(0,1);
  for(let c=-1;c<=1;c++)dot(c,2);for(let c=-1;c<=1;c++)dot(c,3);for(let c=-1;c<=1;c++)dot(c,4);
  dot(-2,5);dot(-1,5);dot(1,5);dot(2,5);dot(2,3);dot(3,4);dot(3,5);dot(2,6);dot(2,7);
  ctx.restore();
}
function label(text,x,y,size,color,align='center'){
  ctx.save(); ctx.font=`bold ${size}px Courier New`; ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline='middle'; ctx.shadowBlur=16; ctx.shadowColor=color;
  ctx.fillText(text,x,y); ctx.restore();
}

function updateGame(){
  frameCount++;
  stepTimer++;
  if(stepTimer<diff.stepFrames)return;
  stepTimer=0;

  dx=ndx; dy=ndy;
  const head=snake[0];
  const nx=head.x+dx, ny=head.y+dy;

  // Wall collision
  if(nx<0||nx>=GRID_COLS||ny<0||ny>=GRID_ROWS){
    gameover(); return;
  }
  // Self collision
  if(snake.some(s=>s.x===nx&&s.y===ny)){
    gameover(); return;
  }

  const newHead={x:nx,y:ny};
  snake.unshift(newHead);

  if(nx===food.x&&ny===food.y){
    score+=10; length++;
    const pos=cellToScreen(food.x,food.y);
    burst(pos.x+CELL_W/2,pos.y+CELL_H/2,'#ff2d78',12);
    placeFood();
  } else {
    snake.pop();
  }

  if(score>highScore) highScore=score;
  tickParticles();
}

function gameover(){
  const pos=cellToScreen(snake[0].x,snake[0].y);
  burst(pos.x+CELL_W/2,pos.y+CELL_H/2,CLR.ui,25);
  if(score>highScore) highScore=score;
  gstate='GAMEOVER';
}

function drawMenu(){
  const grad=ctx.createRadialGradient(LW/2,LH/2,80,LW/2,LH/2,500);
  grad.addColorStop(0,'#001a00'); grad.addColorStop(1,CLR.bg);
  ctx.fillStyle=grad; ctx.fillRect(0,0,LW,LH);

  ctx.save(); ctx.font='bold 108px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const pulse=0.8+0.2*Math.sin(Date.now()/600);
  ctx.shadowBlur=60*pulse; ctx.shadowColor=CLR.ui; ctx.fillStyle=CLR.ui;
  ctx.fillText('SNAKE',LW/2,118); ctx.restore();
  label('SELECT DIFFICULTY',LW/2,210,18,CLR.ui);
  DIFFS.forEach((d,i)=>{
    const bx=LW/2-160,by=248+i*62,bw=320,bh=48;
    const hov=inDiffBtn(i,logMX,logMY);
    ctx.save(); ctx.shadowBlur=hov?35:14; ctx.shadowColor=d.color;
    if(hov){ctx.fillStyle=d.color+'18';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.fill();}
    ctx.globalAlpha=hov?1:0.65; ctx.strokeStyle=d.color; ctx.lineWidth=hov?2.5:1.5;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha=hov?1:0.7;
    label(`${i+1}  ${d.label}`,LW/2,by+bh/2,hov?24:21,d.color);
    if(hov)label('▶',bx+18,by+bh/2,14,d.color);
    ctx.restore();
  });
  label('ARROWS/WASD TO STEER · ESC = MENU',LW/2,LH-22,12,CLR.dim);
  drawBackBtn(); drawScanlines();
}

function drawPlay(){
  ctx.fillStyle=CLR.bg; ctx.fillRect(0,0,LW,LH);
  // Top bar bg
  ctx.fillStyle='#000c1e'; ctx.fillRect(0,0,LW,54);
  ctx.strokeStyle=CLR.dim+'55'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,54); ctx.lineTo(LW,54); ctx.stroke();

  drawGrid();
  drawFood();
  drawSnake();
  drawParticles();
  drawHUD();
  drawBackBtn();
  drawScanlines();
}

function drawGameover(){
  ctx.fillStyle='rgba(0,8,20,0.88)'; ctx.fillRect(0,0,LW,LH);
  drawParticles();
  ctx.save(); ctx.font='bold 88px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const p=0.75+0.25*Math.sin(Date.now()/400);
  ctx.shadowBlur=70*p; ctx.shadowColor=CLR.enemy; ctx.fillStyle=CLR.enemy;
  ctx.fillText('GAME OVER',LW/2,LH/2-70); ctx.restore();
  label(`SCORE: ${score}`,LW/2,LH/2+5,36,CLR.ui);
  label(`LENGTH: ${snake.length}`,LW/2,LH/2+50,24,CLR.dim);
  label(`BEST: ${highScore}`,LW/2,LH/2+90,24,CLR.green);
  if(diff) label(diff.msg,LW/2,LH/2+130,17,diff.color);
  const blink=Math.floor(Date.now()/550)%2===0;
  if(blink)label('CLICK OR ENTER TO CONTINUE',LW/2,LH/2+165,16,CLR.ui);
  drawBackBtn(); drawScanlines();
}

function loop(){
  ctx.clearRect(0,0,CW,CH);
  ctx.save(); ctx.scale(scaleX(),scaleY());
  if(gstate==='MENU')drawMenu();
  else if(gstate==='PLAY'){updateGame();drawPlay();}
  else if(gstate==='GAMEOVER'){tickParticles();drawGameover();}
  ctx.restore();
  drawCursor(rawMX,rawMY);
  requestAnimationFrame(loop);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();
  };
}

loop();
</script>
</body>
</html>
