<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PONG — ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; user-select: none; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const LW = 900, LH = 600;
let CW = 0, CH = 0;

function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const scaleX = () => CW / LW;
const scaleY = () => CH / LH;

const CLR = {
  bg:     '#000814',
  player: '#00f5ff',
  ai:     '#ff2d78',
  ui:     '#ffe600',
  dim:    '#1e3a5f',
  cursor: '#39ff14',
};

const DIFFS = [
  { label:'ROOKIE',    color:'#39ff14', speed:2.2,  errorPx:70, delay:40, pred:0.00, msg:'Getting warmed up…'                    },
  { label:'CASUAL',    color:'#ffe600', speed:4.0,  errorPx:35, delay:20, pred:0.35, msg:'A worthy sparring partner.'             },
  { label:'VETERAN',   color:'#ff8800', speed:6.5,  errorPx:14, delay:10, pred:0.65, msg:"Now we're talking."                    },
  { label:'NIGHTMARE', color:'#ff2d78', speed:11,   errorPx:3,  delay:3,  pred:0.90, msg:'Almost unfair.'                        },
  { label:'GODMODE',   color:'#bf00ff', speed:1e9,  errorPx:0,  delay:0,  pred:1.00, msg:'You cannot win. Resistance is futile.' },
];

const PW = 13, PH = 88, MARGIN = 28;
const WIN  = 7;
const BSPD = 5.2;
const RESPAWN_FRAMES = 42;

let gstate = 'MENU';
let diff   = null;
let score  = { p: 0, ai: 0 };

let player = { x: MARGIN,          y: LH/2 - PH/2, w: PW, h: PH };
let aiPad  = { x: LW - MARGIN - PW, y: LH/2 - PH/2, w: PW, h: PH };
let ball   = { x: LW/2, y: LH/2, r: 8, dx: 0, dy: 0, spd: BSPD };

let aiTarget     = LH / 2;
let aiReactTimer = 0;
let flashTimer   = 0;
let shakeX       = 0;
let shakeY       = 0;
let lastScorer   = 'ai';

let respawnTimer = 0;
let respawnDir   = 1;

let particles = [];
let trail     = [];

// Back button region (logical coords)
const BACK_BTN = { x: 10, y: LH - 32, w: 100, h: 22 };

let rawMX = CW/2, rawMY = CH/2;
let logMX = LW/2, logMY = LH/2;
let mouseY = LH/2;
const keys = {};

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  rawMX  = e.clientX - r.left;
  rawMY  = e.clientY - r.top;
  logMX  = rawMX / scaleX();
  logMY  = rawMY / scaleY();
  mouseY = logMY;
});

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gstate === 'MENU') {
    const k = { Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4,
                Numpad1:0,Numpad2:1,Numpad3:2,Numpad4:3,Numpad5:4 };
    if (k[e.code] !== undefined) startGame(k[e.code]);
  }
  if (gstate === 'WIN'  && (e.code === 'Enter' || e.code === 'Space')) gstate = 'MENU';
  if (gstate === 'PLAY' && e.code === 'Escape') gstate = 'MENU';
});
document.addEventListener('keyup', e => { delete keys[e.code]; });

canvas.addEventListener('click', e => {
  const r  = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / scaleX();
  const my = (e.clientY - r.top)  / scaleY();

  // Back to arcade button
  if (inBackBtn(mx, my)) { window.location.href = 'index.html'; return; }

  if (gstate === 'MENU') {
    DIFFS.forEach((d, i) => {
      if (inBtn(i, mx, my)) startGame(i);
    });
  }
  if (gstate === 'WIN') gstate = 'MENU';
});

function inBtn(i, mx, my) {
  const bx = LW/2 - 160, by = 248 + i*62;
  return mx >= bx && mx <= bx+320 && my >= by && my <= by+48;
}

function inBackBtn(mx, my) {
  return mx >= BACK_BTN.x && mx <= BACK_BTN.x + BACK_BTN.w &&
         my >= BACK_BTN.y && my <= BACK_BTN.y + BACK_BTN.h;
}

const rnd   = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function startGame(idx) {
  diff         = DIFFS[idx];
  score        = { p: 0, ai: 0 };
  particles    = [];
  trail        = [];
  respawnTimer = 0;
  lastScorer   = 'ai';
  player.y     = LH/2 - PH/2;
  aiPad.y      = LH/2 - PH/2;
  launchBall(Math.random() < 0.5 ? 1 : -1);
  gstate = 'PLAY';
}

function launchBall(dir) {
  ball.x   = LW/2; ball.y = LH/2;
  ball.spd = BSPD;
  const a  = rnd(-28, 28) * Math.PI / 180;
  ball.dx  = Math.cos(a) * ball.spd * dir;
  ball.dy  = Math.sin(a) * ball.spd;
  trail    = [];
  respawnTimer = 0;
}

function predictY() {
  let bx = ball.x, by = ball.y, bdx = ball.dx, bdy = ball.dy;
  for (let s = 0; s < 2000 && bx < aiPad.x; s++) {
    bx += bdx; by += bdy;
    if (by - ball.r <= 0)  { by = ball.r;      bdy = Math.abs(bdy);  }
    if (by + ball.r >= LH) { by = LH - ball.r; bdy = -Math.abs(bdy); }
  }
  return by;
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    if(particles.length>=80)break;
    const spd = rnd(1.5, 5), a = rnd(0, Math.PI * 2);
    particles.push({ x, y, dx: Math.cos(a)*spd, dy: Math.sin(a)*spd,
                     life: 1.0, decay: rnd(0.02, 0.05), r: rnd(2, 5), color });
  }
}

function tickParticles() {
  for (const p of particles) {
    p.x += p.dx; p.y += p.dy;
    p.dx *= 0.93; p.dy *= 0.93;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles(){
  if(!particles.length)return;
  const byColor={};
  particles.forEach(p=>{if(!byColor[p.color])byColor[p.color]=[];byColor[p.color].push(p);});
  Object.entries(byColor).forEach(([col,ps])=>{
    ctx.save();ctx.shadowBlur=8;ctx.shadowColor=col;ctx.fillStyle=col;
    ps.forEach(p=>{const r=p.r*p.life;if(r>0){ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();}});
    ctx.restore();
  });
}

function setGlow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow()              { ctx.shadowBlur = 0; }

function drawPaddle(pad, color) {
  ctx.save();
  setGlow(color, 28);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(pad.x, pad.y, pad.w, pad.h, 5); ctx.fill();
  noGlow();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.roundRect(pad.x+2, pad.y+4, pad.w-4, pad.h-8, 3); ctx.fill();
  ctx.restore();
}

function drawBall() {
  for (let i = 0; i < trail.length; i++) {
    const frac = (i + 1) / trail.length;
    const r    = Math.max(0.01, ball.r * frac * 0.7);
    ctx.save();
    ctx.globalAlpha = frac * 0.35;
    ctx.fillStyle   = '#8888ff';
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  setGlow('#ffffff', 35);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  noGlow();
  ctx.fillStyle = '#ddf0ff';
  ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawNet() {
  for (let y = 0; y < LH; y += 28) {
    ctx.save(); setGlow('#003366', 8); ctx.fillStyle = '#0d2137';
    ctx.fillRect(LW/2 - 2, y, 4, 18); ctx.restore();
  }
}

function label(text, x, y, size, color, align = 'center') {
  ctx.save();
  ctx.font         = `bold ${size}px Courier New`;
  ctx.fillStyle    = color;
  ctx.textAlign    = align;
  ctx.textBaseline = 'middle';
  setGlow(color, 16);
  ctx.fillText(text, x, y);
  ctx.restore();
}

let _sl=null;
function drawScanlines(){
  if(!_sl){_sl=document.createElement('canvas');_sl.width=LW;_sl.height=LH;const sc=_sl.getContext('2d');sc.fillStyle='rgba(0,0,0,0.05)';for(let y=0;y<LH;y+=3)sc.fillRect(0,y,LW,1);}
  ctx.drawImage(_sl,0,0);
}

function drawBackBtn() {
  const hov = inBackBtn(logMX, logMY);
  ctx.save();
  ctx.font = 'bold 11px Courier New';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = hov ? '#00f5ff' : '#1e3a5f';
  ctx.shadowBlur = hov ? 12 : 0;
  ctx.shadowColor = '#00f5ff';
  ctx.fillText('← ARCADE', BACK_BTN.x, BACK_BTN.y + BACK_BTN.h/2);
  ctx.restore();
}

let _cursorCanvas = null;
function drawCursor(cx, cy) {
  if (!_cursorCanvas) {
    _cursorCanvas = document.createElement('canvas'); _cursorCanvas.width = 50; _cursorCanvas.height = 60;
    const cc = _cursorCanvas.getContext('2d'), p = 2, fg = CLR.cursor, dk = CLR.bg, OX = 18, OY = 26;
    cc.shadowBlur = 10; cc.shadowColor = fg;
    const dot = (c, r, col) => { cc.fillStyle = col||fg; cc.fillRect(OX+c*p, OY+r*p, p, p); };
    dot(-2,-6); dot(-2,-5); dot(1,-6); dot(1,-5);
    for (let c=-2;c<=2;c++) dot(c,-4); for (let c=-2;c<=2;c++) dot(c,-3);
    dot(-2,-2); dot(-1,-2,dk); dot(0,-2); dot(1,-2,dk); dot(2,-2);
    for (let c=-2;c<=2;c++) dot(c,-1);
    dot(-1,0); dot(0,0); dot(1,0); dot(0,1);
    for (let c=-1;c<=1;c++) dot(c,2); for (let c=-1;c<=1;c++) dot(c,3); for (let c=-1;c<=1;c++) dot(c,4);
    dot(-2,5); dot(-1,5); dot(1,5); dot(2,5); dot(2,3); dot(3,4); dot(3,5); dot(2,6); dot(2,7);
  }
  ctx.drawImage(_cursorCanvas, Math.round(cx)-18, Math.round(cy)-26);
}

let _menuGradient = null;
function drawMenu() {
  if (!_menuGradient) {
    _menuGradient = ctx.createRadialGradient(LW/2, LH/2, 80, LW/2, LH/2, 500);
    _menuGradient.addColorStop(0, '#00102a');
    _menuGradient.addColorStop(1, CLR.bg);
  }
  ctx.fillStyle = _menuGradient;
  ctx.fillRect(0, 0, LW, LH);

  ctx.save();
  ctx.font = 'bold 108px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pulse = 0.8 + 0.2 * Math.sin(Date.now() / 600);
  ctx.shadowBlur = 60 * pulse; ctx.shadowColor = CLR.player;
  ctx.fillStyle  = CLR.player;
  ctx.fillText('PONG', LW/2, 118);
  ctx.restore();

  label('CHOOSE YOUR FATE', LW/2, 210, 18, CLR.ui);

  DIFFS.forEach((d, i) => {
    const bx = LW/2 - 160, by = 248 + i*62, bw = 320, bh = 48;
    const hovered = inBtn(i, logMX, logMY);
    ctx.save();
    ctx.shadowBlur = hovered ? 35 : 14; ctx.shadowColor = d.color;
    if (hovered) {
      ctx.fillStyle = d.color + '18';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.fill();
    }
    ctx.globalAlpha = hovered ? 1.0 : 0.65;
    ctx.strokeStyle = d.color;
    ctx.lineWidth   = hovered ? 2.5 : 1.5;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = hovered ? 1.0 : 0.7;
    label(`${i+1}  ${d.label}`, LW/2, by + bh/2, hovered ? 24 : 21, d.color);
    if (hovered) label('▶', bx + 18, by + bh/2, 14, d.color);
    ctx.restore();
  });

  label('MOUSE / W·S  ·  PRESS 1–5  ·  ESC = MENU', LW/2, LH - 22, 12, CLR.dim);
  drawBackBtn();
  drawScanlines();
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,8,20,0.85)'; ctx.fillRect(0, 0, LW, LH);
  drawParticles();
  const won   = score.p >= WIN;
  const color = won ? CLR.player : CLR.ai;
  ctx.save();
  ctx.font = 'bold 88px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const p = 0.75 + 0.25 * Math.sin(Date.now() / 400);
  ctx.shadowBlur = 70 * p; ctx.shadowColor = color; ctx.fillStyle = color;
  ctx.fillText(won ? 'YOU WIN!' : 'GAME OVER', LW/2, LH/2 - 60);
  ctx.restore();
  label(`${score.p}   –   ${score.ai}`, LW/2, LH/2 + 20, 44, '#ffffff');
  if (!won && diff) label(diff.msg, LW/2, LH/2 + 85, 17, CLR.ai);
  const blink = Math.floor(Date.now() / 550) % 2 === 0;
  if (blink) label('CLICK OR ENTER TO PLAY AGAIN', LW/2, LH/2 + 140, 16, CLR.ui);
  drawBackBtn();
  drawScanlines();
}

let _courtGradient = null;
function drawGame() {
  ctx.save();
  ctx.translate(shakeX, shakeY);
  ctx.fillStyle = CLR.bg; ctx.fillRect(-12, -12, LW+24, LH+24);
  if (!_courtGradient) {
    _courtGradient = ctx.createLinearGradient(0, 0, LW, 0);
    _courtGradient.addColorStop(0,   'rgba(0,245,255,0.04)');
    _courtGradient.addColorStop(0.45,'transparent');
    _courtGradient.addColorStop(0.55,'transparent');
    _courtGradient.addColorStop(1,   'rgba(255,45,120,0.04)');
  }
  ctx.fillStyle = _courtGradient; ctx.fillRect(0, 0, LW, LH);
  ctx.restore();
  drawNet();
  ctx.save();
  ctx.font = 'bold 72px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  setGlow(CLR.player, 25); ctx.fillStyle = CLR.player; ctx.fillText(score.p,  LW/4,    22);
  setGlow(CLR.ai,     25); ctx.fillStyle = CLR.ai;     ctx.fillText(score.ai, LW*3/4,  22);
  ctx.restore();
  if (diff) label(diff.label, LW/2, 32, 13, diff.color);
  label(`FIRST TO ${WIN}`, LW/2, LH - 18, 12, CLR.dim);
  label('W/S · MOUSE · ESC', 55, LH - 18, 11, '#0d2137', 'left');
  drawPaddle(player, CLR.player);
  drawPaddle(aiPad,  CLR.ai);
  if (respawnTimer <= 0) drawBall();
  drawParticles();
  if (flashTimer > 0) {
    const col = lastScorer === 'p' ? CLR.player : CLR.ai;
    ctx.save();
    ctx.globalAlpha = (flashTimer / 18) * 0.18;
    ctx.fillStyle   = col;
    ctx.fillRect(0, 0, LW, LH);
    ctx.restore();
    flashTimer--;
  }
  drawBackBtn();
  drawScanlines();
  ctx.restore();
}

function updateGame() {
  let ty = mouseY - PH/2;
  if (keys['ArrowUp']   || keys['KeyW']) ty -= 14;
  if (keys['ArrowDown'] || keys['KeyS']) ty += 14;
  player.y += (ty - player.y) * 0.25;
  player.y  = clamp(player.y, 0, LH - PH);
  shakeX *= 0.75; shakeY *= 0.75;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;
  if (respawnTimer > 0) {
    respawnTimer--;
    if (respawnTimer === 0) launchBall(respawnDir);
    tickParticles();
    return;
  }
  aiReactTimer++;
  if (aiReactTimer >= Math.max(1, diff.delay)) {
    aiReactTimer = 0;
    if (ball.dx > 0) {
      const pred  = predictY();
      const blend = ball.y + (pred - ball.y) * diff.pred;
      aiTarget = blend - aiPad.h/2 + rnd(-diff.errorPx/2, diff.errorPx/2);
    } else {
      aiTarget = LH/2 - aiPad.h/2;
    }
  }
  if (diff.speed >= 1e8) {
    aiPad.y = clamp(aiTarget, 0, LH - PH);
  } else {
    const d = aiTarget - aiPad.y;
    aiPad.y = clamp(aiPad.y + clamp(d, -diff.speed, diff.speed), 0, LH - PH);
  }
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 10) trail.shift();
  ball.x += ball.dx;
  ball.y += ball.dy;
  if (ball.y - ball.r < 0)  { ball.y = ball.r;      ball.dy =  Math.abs(ball.dy); burst(ball.x, 0,  '#8888ff', 5); }
  if (ball.y + ball.r > LH) { ball.y = LH - ball.r; ball.dy = -Math.abs(ball.dy); burst(ball.x, LH, '#8888ff', 5); }
  if (ball.dx < 0 &&
      ball.x - ball.r < player.x + player.w &&
      ball.x + ball.r > player.x &&
      ball.y + ball.r > player.y &&
      ball.y - ball.r < player.y + player.h) {
    ball.x   = player.x + player.w + ball.r + 1;
    ball.spd = Math.min(ball.spd + 0.35, 16);
    const rel = clamp((ball.y - (player.y + player.h/2)) / (player.h/2), -1, 1);
    const ang = rel * 60 * Math.PI / 180;
    ball.dx = Math.abs(Math.cos(ang)) * ball.spd;
    ball.dy = Math.sin(ang) * ball.spd;
    burst(ball.x, ball.y, CLR.player, 12);
    shakeX = rnd(-4, 4); shakeY = rnd(-4, 4);
  }
  if (ball.dx > 0 &&
      ball.x + ball.r > aiPad.x &&
      ball.x - ball.r < aiPad.x + aiPad.w &&
      ball.y + ball.r > aiPad.y &&
      ball.y - ball.r < aiPad.y + aiPad.h) {
    ball.x   = aiPad.x - ball.r - 1;
    ball.spd = Math.min(ball.spd + 0.35, 16);
    const rel = clamp((ball.y - (aiPad.y + aiPad.h/2)) / (aiPad.h/2), -1, 1);
    const ang = rel * 60 * Math.PI / 180;
    ball.dx = -(Math.abs(Math.cos(ang)) * ball.spd);
    ball.dy = Math.sin(ang) * ball.spd;
    burst(ball.x, ball.y, CLR.ai, 12);
    shakeX = rnd(-4, 4); shakeY = rnd(-4, 4);
  }
  if (ball.x + ball.r < 0) {
    score.ai++; lastScorer = 'ai'; flashTimer = 18; trail = [];
    burst(0, ball.y, CLR.ai, 22);
    shakeX = -8; shakeY = rnd(-4, 4);
    ball.dx = 0; ball.dy = 0; ball.x = LW/2; ball.y = LH/2;
    if (score.ai >= WIN) { gstate = 'WIN'; }
    else { respawnTimer = RESPAWN_FRAMES; respawnDir = 1; }
  } else if (ball.x - ball.r > LW) {
    score.p++; lastScorer = 'p'; flashTimer = 18; trail = [];
    burst(LW, ball.y, CLR.player, 22);
    shakeX = 8; shakeY = rnd(-4, 4);
    ball.dx = 0; ball.dy = 0; ball.x = LW/2; ball.y = LH/2;
    if (score.p >= WIN) { gstate = 'WIN'; }
    else { respawnTimer = RESPAWN_FRAMES; respawnDir = -1; }
  }
  tickParticles();
}

function loop() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.save();
  ctx.scale(scaleX(), scaleY());
  if      (gstate === 'MENU') drawMenu();
  else if (gstate === 'PLAY') { updateGame(); drawGame(); }
  else if (gstate === 'WIN')  { tickParticles(); drawWin(); }
  ctx.restore();
  drawCursor(rawMX, rawMY);
  requestAnimationFrame(loop);
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.arcTo(x+w, y,   x+w, y+h, r);
    this.arcTo(x+w, y+h, x,   y+h, r);
    this.arcTo(x,   y+h, x,   y,   r);
    this.arcTo(x,   y,   x+w, y,   r);
    this.closePath();
  };
}

loop();
</script>
</body>
</html>
