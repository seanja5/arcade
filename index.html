<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARCADE — RETROVOX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000814; overflow: hidden; user-select: none; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="cursor" style="position:fixed;top:0;left:0;pointer-events:none;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cursorCanvas = document.getElementById('cursor');
const cctx = cursorCanvas.getContext('2d');

const LW = 900, LH = 600;
let CW = 0, CH = 0;

function resize() {
  CW = canvas.width = window.innerWidth;
  CH = canvas.height = window.innerHeight;
  cursorCanvas.width = CW;
  cursorCanvas.height = CH;
}
window.addEventListener('resize', resize);
resize();

const scaleX = () => CW / LW;
const scaleY = () => CH / LH;

const CLR = {
  bg: '#000814', player: '#00f5ff', enemy: '#ff2d78',
  ui: '#ffe600', green: '#39ff14', orange: '#ff8800',
  purple: '#bf00ff', dim: '#1e3a5f', cursor: '#39ff14'
};

const GAMES = [
  { name: 'PONG',         color: '#00f5ff', url: 'pong.html'     },
  { name: 'APE CLIMB',    color: '#ff8800', url: 'apeclimb.html' },
  { name: 'SPACE RAIDERS',color: '#39ff14', url: 'invaders.html' },
  { name: 'SNAKE',        color: '#ffe600', url: 'snake.html'    },
  { name: 'BREAKOUT',     color: '#ff2d78', url: 'breakout.html' },
  { name: 'ROAD HOPPER',  color: '#bf00ff', url: 'frogger.html'  },
];

let rawMX = CW/2, rawMY = CH/2;
let logMX = LW/2, logMY = LH/2;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  rawMX = e.clientX - r.left;
  rawMY = e.clientY - r.top;
  logMX = rawMX / scaleX();
  logMY = rawMY / scaleY();
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / scaleX();
  const my = (e.clientY - r.top) / scaleY();
  GAMES.forEach((g, i) => {
    const tv = getTVRect(i);
    if (mx >= tv.x && mx <= tv.x + tv.w && my >= tv.y && my <= tv.y + tv.h + 50) {
      window.location.href = g.url;
    }
  });
});

function getTVRect(i) {
  const col = i % 3, row = Math.floor(i / 3);
  const tvW = 220, tvH = 165;
  const padX = 60, padY = 85;
  const gapX = (LW - padX*2 - tvW*3) / 2;
  const gapY = 48;
  return { x: padX + col*(tvW+gapX), y: padY + row*(tvH+gapY+30), w: tvW, h: tvH };
}

// ─── TV Preview Simulations ───────────────────────────────────────────────────
const previews = [];

// PONG preview
previews[0] = (() => {
  let bx=120,by=90,bdx=1.8,bdy=1.2;
  let p1y=70,p2y=70,s1=0,s2=0;
  return function(ctx2, t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    ctx2.strokeStyle='#00f5ff22'; ctx2.setLineDash([4,4]);
    ctx2.beginPath(); ctx2.moveTo(120,0); ctx2.lineTo(120,180); ctx2.stroke();
    ctx2.setLineDash([]);
    // paddles
    ctx2.fillStyle='#00f5ff'; ctx2.shadowBlur=10; ctx2.shadowColor='#00f5ff';
    ctx2.fillRect(8,p1y,5,36); ctx2.fillStyle='#ff2d78'; ctx2.shadowColor='#ff2d78';
    ctx2.fillRect(227,p2y,5,36);
    ctx2.shadowBlur=0;
    // ball
    bx+=bdx; by+=bdy;
    if(by<4||by>176){bdy*=-1;}
    if(bx<14&&by>p1y&&by<p1y+36){bdx=Math.abs(bdx);bx=14;}
    if(bx>226&&by>p2y&&by<p2y+36){bdx=-Math.abs(bdx);bx=226;}
    if(bx<0){s2++;bx=120;by=90;bdx=1.8;bdy=(Math.random()-0.5)*2.5;}
    if(bx>240){s1++;bx=120;by=90;bdx=-1.8;bdy=(Math.random()-0.5)*2.5;}
    p1y+=(by-18-p1y)*0.08; p2y+=(by-18-p2y)*0.08;
    p1y=Math.max(0,Math.min(144,p1y)); p2y=Math.max(0,Math.min(144,p2y));
    ctx2.fillStyle='#fff'; ctx2.shadowBlur=12; ctx2.shadowColor='#fff';
    ctx2.beginPath(); ctx2.arc(bx,by,4,0,Math.PI*2); ctx2.fill();
    ctx2.shadowBlur=0;
    ctx2.font='bold 18px Courier New'; ctx2.textAlign='center'; ctx2.fillStyle='#00f5ff';
    ctx2.fillText(s1,60,20); ctx2.fillStyle='#ff2d78'; ctx2.fillText(s2,180,20);
  };
})();

// APE CLIMB preview
previews[1] = (() => {
  let px=30,py=155,barrels=[];
  let spawnT=0;
  const floors=[{y:160,x1:10,x2:230},{y:120,x1:10,x2:230},{y:80,x1:10,x2:230},{y:40,x1:10,x2:230}];
  return function(ctx2,t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    // floors
    ctx2.strokeStyle='#ff8800'; ctx2.lineWidth=3; ctx2.shadowBlur=8; ctx2.shadowColor='#ff880066';
    floors.forEach(f=>{ctx2.beginPath();ctx2.moveTo(f.x1,f.y);ctx2.lineTo(f.x2,f.y);ctx2.stroke();});
    ctx2.shadowBlur=0; ctx2.lineWidth=1;
    // gorilla (simple)
    ctx2.fillStyle='#ff8800'; ctx2.shadowBlur=10; ctx2.shadowColor='#ff8800';
    ctx2.fillRect(205,24,20,16);
    ctx2.shadowBlur=0;
    // player
    ctx2.fillStyle='#00f5ff'; ctx2.fillRect(px,py-10,8,10);
    // barrels
    spawnT++;
    if(spawnT>80){spawnT=0; barrels.push({x:200,y:40,floor:3,dx:-1.2});}
    barrels=barrels.filter(b=>{
      b.x+=b.dx;
      if(b.floor===3&&b.x<20){b.floor=2;b.y=80;b.dx=1.2;}
      else if(b.floor===2&&b.x>220){b.floor=1;b.y=120;b.dx=-1.2;}
      else if(b.floor===1&&b.x<20){b.floor=0;b.y=160;b.dx=1.2;}
      else if(b.floor===0&&b.x>240){return false;}
      ctx2.fillStyle='#ff8800'; ctx2.shadowBlur=6; ctx2.shadowColor='#ff8800';
      ctx2.beginPath(); ctx2.arc(b.x,b.y-6,5,0,Math.PI*2); ctx2.fill();
      ctx2.shadowBlur=0;
      return true;
    });
    // auto move player
    px+=0.8; if(px>220){px=20;}
    // score label
    ctx2.font='bold 8px Courier New'; ctx2.fillStyle='#ff8800'; ctx2.textAlign='left';
    ctx2.fillText('APE CLIMB',4,10);
  };
})();

// SPACE RAIDERS preview (asteroid shooter)
previews[2] = (() => {
  let angle=0, bullets=[], asteroids=[], spawnT=0;
  const cx=120, cy=90;
  for(let i=0;i<4;i++){
    const a=rnd2(0,Math.PI*2);
    asteroids.push({x:cx+Math.cos(a)*100,y:cy+Math.sin(a)*80,dx:-Math.cos(a)*0.7,dy:-Math.sin(a)*0.7,r:10+Math.random()*8});
  }
  function rnd2(a,b){return a+Math.random()*(b-a);}
  return function(ctx2,t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    // stars
    ctx2.fillStyle='#ffffff';
    for(let i=0;i<20;i++){ctx2.globalAlpha=0.3+0.3*Math.sin(i+t*0.02);ctx2.fillRect((i*37)%240,(i*53)%180,1,1);}
    ctx2.globalAlpha=1;
    // auto rotate
    angle+=0.025;
    // spawn asteroids
    spawnT++;
    if(spawnT>90&&asteroids.length<5){spawnT=0;const a2=rnd2(0,Math.PI*2);asteroids.push({x:cx+Math.cos(a2)*110,y:cy+Math.sin(a2)*85,dx:-Math.cos(a2)*0.8,dy:-Math.sin(a2)*0.8,r:8+Math.random()*7});}
    // move asteroids
    asteroids.forEach(a=>{a.x+=a.dx;a.y+=a.dy;});
    asteroids=asteroids.filter(a=>Math.hypot(a.x-cx,a.y-cy)>5&&Math.hypot(a.x-cx,a.y-cy)<130);
    // shoot bullet every 50 frames
    if(t%50===0) bullets.push({x:cx+Math.cos(angle)*8,y:cy+Math.sin(angle)*8,dx:Math.cos(angle)*3.5,dy:Math.sin(angle)*3.5,life:40});
    // move bullets
    bullets.forEach(b=>{b.x+=b.dx;b.y+=b.dy;b.life--;});
    bullets=bullets.filter(b=>b.life>0);
    // bullet-asteroid collision
    bullets.forEach(b=>{asteroids=asteroids.filter(a=>{if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+3){b.life=0;return false;}return true;});});
    // draw asteroids
    asteroids.forEach(a=>{
      ctx2.strokeStyle='#aaaaaa'; ctx2.shadowBlur=5; ctx2.shadowColor='#888888'; ctx2.lineWidth=1.5;
      ctx2.beginPath(); ctx2.arc(a.x,a.y,a.r,0,Math.PI*2); ctx2.stroke();
      ctx2.shadowBlur=0;
    });
    // draw bullets
    bullets.forEach(b=>{ctx2.fillStyle='#39ff14';ctx2.shadowBlur=6;ctx2.shadowColor='#39ff14';ctx2.beginPath();ctx2.arc(b.x,b.y,2,0,Math.PI*2);ctx2.fill();ctx2.shadowBlur=0;});
    // draw ship (triangle)
    ctx2.save(); ctx2.translate(cx,cy); ctx2.rotate(angle);
    ctx2.fillStyle='#39ff14'; ctx2.shadowBlur=8; ctx2.shadowColor='#39ff14';
    ctx2.beginPath(); ctx2.moveTo(0,-7); ctx2.lineTo(5,6); ctx2.lineTo(-5,6); ctx2.closePath(); ctx2.fill();
    ctx2.shadowBlur=0; ctx2.restore();
    ctx2.font='bold 8px Courier New'; ctx2.fillStyle='#39ff14'; ctx2.textAlign='left';
    ctx2.fillText('SPACE RAIDERS',4,10);
  };
})();

// SNAKE preview
previews[3] = (() => {
  const GS=12, COLS=20, ROWS=15;
  let snake=[{x:10,y:7},{x:9,y:7},{x:8,y:7}];
  let food={x:15,y:5},dx=1,dy=0,moveT=0;
  function newFood(){food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  return function(ctx2,t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    ctx2.strokeStyle='#ffe60011'; ctx2.lineWidth=0.5;
    for(let x=0;x<=COLS;x++){ctx2.beginPath();ctx2.moveTo(x*GS,0);ctx2.lineTo(x*GS,180);ctx2.stroke();}
    for(let y=0;y<=ROWS;y++){ctx2.beginPath();ctx2.moveTo(0,y*GS);ctx2.lineTo(240,y*GS);ctx2.stroke();}
    moveT++;
    if(moveT>8){
      moveT=0;
      // steer toward food
      const head=snake[0];
      if(Math.abs(food.x-head.x)>Math.abs(food.y-head.y)){
        dx=food.x>head.x?1:-1; dy=0;
      } else {
        dy=food.y>head.y?1:-1; dx=0;
      }
      const nx=(head.x+dx+COLS)%COLS, ny=(head.y+dy+ROWS)%ROWS;
      snake.unshift({x:nx,y:ny});
      if(nx===food.x&&ny===food.y){newFood();}
      else snake.pop();
      if(snake.length>20){snake=snake.slice(0,20);}
    }
    snake.forEach((s,i)=>{
      const a=1-i/snake.length;
      ctx2.fillStyle=`rgba(255,230,0,${a})`;
      ctx2.shadowBlur=i===0?10:0; ctx2.shadowColor='#ffe600';
      ctx2.fillRect(s.x*GS+1,s.y*GS+1,GS-2,GS-2);
      ctx2.shadowBlur=0;
    });
    ctx2.fillStyle='#ff2d78'; ctx2.shadowBlur=8; ctx2.shadowColor='#ff2d78';
    ctx2.beginPath(); ctx2.arc(food.x*GS+GS/2,food.y*GS+GS/2,4,0,Math.PI*2); ctx2.fill();
    ctx2.shadowBlur=0;
    ctx2.font='bold 8px Courier New'; ctx2.fillStyle='#ffe600'; ctx2.textAlign='left';
    ctx2.fillText('SNAKE',4,10);
  };
})();

// BREAKOUT preview
previews[4] = (() => {
  let bricks=[];
  for(let r=0;r<5;r++) for(let c=0;c<10;c++) bricks.push({x:c*22+10,y:r*12+15,alive:true});
  let bx=120,by=130,bdx=1.5,bdy=-2,px=100;
  return function(ctx2,t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    const brkColors=['#ff2d78','#ff8800','#ffe600','#39ff14','#00f5ff'];
    bricks.forEach((b,i)=>{
      if(!b.alive)return;
      const r=Math.floor(i/10);
      ctx2.fillStyle=brkColors[r%5]; ctx2.shadowBlur=4; ctx2.shadowColor=brkColors[r%5];
      ctx2.fillRect(b.x,b.y,20,9);
      ctx2.shadowBlur=0;
    });
    bx+=bdx; by+=bdy;
    if(bx<4||bx>236){bdx*=-1;}
    if(by<4){bdy=Math.abs(bdy);}
    if(by>180){by=90;bdy=-2;bdx=1.5;}
    if(by>160&&Math.abs(bx-px)<24&&bdy>0){bdy=-Math.abs(bdy);}
    bricks.forEach(b=>{
      if(!b.alive)return;
      if(bx>b.x&&bx<b.x+20&&by>b.y&&by<b.y+9){b.alive=false;bdy*=-1;}
    });
    if(!bricks.some(b=>b.alive)){bricks.forEach(b=>b.alive=true);}
    px+=(bx-px)*0.06; px=Math.max(12,Math.min(228,px));
    ctx2.fillStyle='#ff2d78'; ctx2.shadowBlur=10; ctx2.shadowColor='#ff2d78';
    ctx2.fillRect(px-22,170,44,6);
    ctx2.shadowBlur=0;
    ctx2.fillStyle='#fff'; ctx2.shadowBlur=10; ctx2.shadowColor='#fff';
    ctx2.beginPath(); ctx2.arc(bx,by,4,0,Math.PI*2); ctx2.fill();
    ctx2.shadowBlur=0;
    ctx2.font='bold 8px Courier New'; ctx2.fillStyle='#ff2d78'; ctx2.textAlign='left';
    ctx2.fillText('BREAKOUT',4,10);
  };
})();

// ROAD HOPPER preview
previews[5] = (() => {
  let cars=[
    {x:20,y:110,dx:1.5,color:'#ff2d78'},{x:100,y:125,dx:-1.2,color:'#ff8800'},
    {x:170,y:140,dx:1.0,color:'#ff2d78'},{x:50,y:155,dx:-1.8,color:'#ff8800'},
  ];
  let logs=[
    {x:30,y:50,dx:1.3},{x:130,y:65,dx:-1.0},{x:60,y:80,dx:1.6},{x:180,y:95,dx:-1.2},
  ];
  let fx=120,fy=165,ft=0;
  return function(ctx2,t) {
    ctx2.fillStyle='#000814'; ctx2.fillRect(0,0,240,180);
    // road
    ctx2.fillStyle='#111'; ctx2.fillRect(0,100,240,80);
    for(let i=0;i<5;i++){ctx2.strokeStyle='#ffe60033';ctx2.setLineDash([8,8]);
      ctx2.beginPath();ctx2.moveTo(0,110+i*15);ctx2.lineTo(240,110+i*15);ctx2.stroke();}
    ctx2.setLineDash([]);
    // river
    ctx2.fillStyle='#001440'; ctx2.fillRect(0,40,240,60);
    // grass
    ctx2.fillStyle='#002200'; ctx2.fillRect(0,0,240,40);
    ctx2.fillStyle='#002200'; ctx2.fillRect(0,100,240,5);
    // logs
    logs.forEach(l=>{
      l.x+=l.dx; if(l.x>260)l.x=-50; if(l.x<-50)l.x=260;
      ctx2.fillStyle='#663300'; ctx2.shadowBlur=4; ctx2.shadowColor='#ff8800';
      ctx2.fillRect(l.x,l.y,40,10); ctx2.shadowBlur=0;
    });
    // cars
    cars.forEach(c=>{
      c.x+=c.dx; if(c.x>260)c.x=-30; if(c.x<-30)c.x=260;
      ctx2.fillStyle=c.color; ctx2.shadowBlur=6; ctx2.shadowColor=c.color;
      ctx2.fillRect(c.x,c.y,26,12); ctx2.shadowBlur=0;
    });
    // frog auto hop
    ft++;
    if(ft>60){ft=0; fy-=12; if(fy<20)fy=165;}
    ctx2.fillStyle='#bf00ff'; ctx2.shadowBlur=10; ctx2.shadowColor='#bf00ff';
    ctx2.fillRect(fx-5,fy-8,10,10); ctx2.shadowBlur=0;
    // lily pads
    for(let i=0;i<5;i++){ctx2.fillStyle='#39ff14'; ctx2.shadowBlur=4; ctx2.shadowColor='#39ff14';
      ctx2.beginPath(); ctx2.arc(24+i*48,8,7,0,Math.PI*2); ctx2.fill(); ctx2.shadowBlur=0;}
    ctx2.font='bold 8px Courier New'; ctx2.fillStyle='#bf00ff'; ctx2.textAlign='left';
    ctx2.fillText('ROAD HOPPER',4,10);
  };
})();

// Per-TV offscreen canvases
const tvCanvases = GAMES.map(()=>{
  const c = document.createElement('canvas');
  c.width = 240; c.height = 180;
  return c;
});
const tvContexts = tvCanvases.map(c => c.getContext('2d'));

function updatePreviewCanvases() {
  for (let i = 0; i < previews.length; i++) {
    previews[i](tvContexts[i], frameCount);
  }
}

// Prime all previews once so first paint is populated.
for (let i = 0; i < previews.length; i++) previews[i](tvContexts[i], 0);

// Pre-rendered TV overlay (scanlines + vignette) — built once, shared by all TVs
const tvOverlay = (() => {
  const tvW = 220, tvH = 165;
  const oc = document.createElement('canvas');
  oc.width = tvW; oc.height = tvH;
  const oc2 = oc.getContext('2d');
  // Scanlines
  oc2.fillStyle = 'rgba(0,0,0,0.06)';
  for (let y = 0; y < tvH; y += 3) oc2.fillRect(0, y, tvW, 1);
  // Vignette
  const vig = oc2.createRadialGradient(tvW/2, tvH/2, tvW*0.2, tvW/2, tvH/2, tvW*0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  oc2.fillStyle = vig;
  oc2.fillRect(0, 0, tvW, tvH);
  return oc;
})();

// Pre-rendered cursor — built once
const _cursorCanvas = (() => {
  const oc = document.createElement('canvas');
  oc.width = 50; oc.height = 60;
  const cc = oc.getContext('2d');
  const p = 2, fg = CLR.cursor, dk = CLR.bg;
  const OX = 18, OY = 26;
  cc.shadowBlur = 10; cc.shadowColor = fg;
  const dot = (c, r, col) => { cc.fillStyle = col||fg; cc.fillRect(OX+c*p, OY+r*p, p, p); };
  dot(-2,-6);dot(-2,-5);dot(1,-6);dot(1,-5);
  for(let c=-2;c<=2;c++)dot(c,-4);for(let c=-2;c<=2;c++)dot(c,-3);
  dot(-2,-2);dot(-1,-2,dk);dot(0,-2);dot(1,-2,dk);dot(2,-2);
  for(let c=-2;c<=2;c++)dot(c,-1);
  dot(-1,0);dot(0,0);dot(1,0);dot(0,1);
  for(let c=-1;c<=1;c++)dot(c,2);for(let c=-1;c<=1;c++)dot(c,3);for(let c=-1;c<=1;c++)dot(c,4);
  dot(-2,5);dot(-1,5);dot(1,5);dot(2,5);dot(2,3);dot(3,4);dot(3,5);dot(2,6);dot(2,7);
  return oc;
})();

let frameCount = 0;

function drawCursor(cx, cy) {
  cctx.clearRect(0, 0, CW, CH);
  cctx.drawImage(_cursorCanvas, Math.round(cx) - 18, Math.round(cy) - 26);
}

function drawTV(i) {
  const g = GAMES[i];
  const tv = getTVRect(i);
  const hovered = logMX >= tv.x && logMX <= tv.x + tv.w &&
                  logMY >= tv.y && logMY <= tv.y + tv.h + 50;
  const lift = hovered ? -8 : 0;
  const glowA = hovered ? 0.9 : 0.4;

  const tc = tvCanvases[i];

  ctx.save();
  ctx.translate(tv.x + tv.w/2, tv.y + tv.h/2 + lift);

  // TV glow
  if (hovered) {
    ctx.shadowBlur = 40;
    ctx.shadowColor = g.color;
  }

  // Bezel
  const bx = -tv.w/2 - 14, by = -tv.h/2 - 12;
  const bw = tv.w + 28, bh = tv.h + 24;
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  roundRect(ctx, bx, by, bw, bh, 14);
  ctx.fill();

  // Inner bezel ring
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRect(ctx, bx+4, by+4, bw-8, bh-8, 10);
  ctx.stroke();

  ctx.shadowBlur = 0;

  // Draw preview
  ctx.drawImage(tc, -tv.w/2, -tv.h/2, tv.w, tv.h);

  // Scanlines + vignette from pre-rendered overlay
  ctx.drawImage(tvOverlay, -tv.w/2, -tv.h/2, tv.w, tv.h);

  // Screen border glow
  ctx.shadowBlur = 0;
  ctx.strokeStyle = g.color + (hovered ? '99' : '44');
  ctx.lineWidth = 2;
  ctx.beginPath();
  roundRect(ctx, -tv.w/2, -tv.h/2, tv.w, tv.h, 6);
  ctx.stroke();

  // TV stand
  ctx.fillStyle = '#222';
  ctx.fillRect(-10, tv.h/2 + 12, 20, 20);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-26, tv.h/2 + 30, 52, 8);
  ctx.beginPath();
  roundRect(ctx, -30, tv.h/2 + 35, 60, 6, 3);
  ctx.fillStyle = '#2a2a2a';
  ctx.fill();

  // Knobs on bezel
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(tv.w/2 + 7, -10, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tv.w/2 + 7,  2,  3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tv.w/2 + 7, 14, 3, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  // Game title below TV
  ctx.save();
  ctx.font = `bold 13px Courier New`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = g.color;
  ctx.shadowBlur = hovered ? 20 : 10;
  ctx.shadowColor = g.color;
  ctx.fillText(g.name, tv.x + tv.w/2, tv.y + tv.h + 48 + lift);
  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function drawBackground() {
  ctx.fillStyle = CLR.bg;
  ctx.fillRect(0, 0, LW, LH);
  // Grid lines — batched into two paths
  ctx.strokeStyle = 'rgba(0,245,255,0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < LW; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, LH); }
  for (let y = 0; y < LH; y += 40) { ctx.moveTo(0, y); ctx.lineTo(LW, y); }
  ctx.stroke();
}

function drawTitle() {
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 500);
  ctx.save();
  ctx.font = 'bold 56px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 45 * pulse; ctx.shadowColor = '#ffe600'; ctx.fillStyle = '#ffe600';
  ctx.fillText('ARCADE', LW/2, 46);
  ctx.font = 'bold 11px Courier New';
  ctx.shadowBlur = 8; ctx.shadowColor = CLR.dim; ctx.fillStyle = CLR.dim;
  ctx.fillText('RETROVOX ENTERTAINMENT SYSTEMS', LW/2, 74);
  ctx.restore();
}

let _sl=null;
function drawScanlines(){
  if(!_sl){_sl=document.createElement('canvas');_sl.width=LW;_sl.height=LH;const sc=_sl.getContext('2d');sc.fillStyle='rgba(0,0,0,0.05)';for(let y=0;y<LH;y+=3)sc.fillRect(0,y,LW,1);}
  ctx.drawImage(_sl,0,0);
}

function drawFooter() {
  ctx.save();
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = CLR.dim;
  ctx.shadowBlur = 4;
  ctx.shadowColor = CLR.dim;
  ctx.fillText('© RETROVOX ENTERTAINMENT SYSTEMS · 1983', LW/2, LH - 6);
  ctx.restore();
}

function loop() {
  frameCount++;
  ctx.clearRect(0, 0, CW, CH);
  ctx.save();
  ctx.scale(scaleX(), scaleY());

  updatePreviewCanvases();
  drawBackground();
  drawTitle();
  for (let i = 0; i < 6; i++) drawTV(i);
  drawScanlines();
  drawFooter();

  ctx.restore();
  drawCursor(rawMX, rawMY);
  requestAnimationFrame(loop);
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    roundRect(this, x, y, w, h, r);
    return this;
  };
}

loop();
</script>
