<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROAD HOPPER — ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000814; overflow: hidden; user-select: none; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const LW = 900, LH = 600;
let CW = 0, CH = 0;
function resize(){CW=canvas.width=window.innerWidth;CH=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();
const scaleX=()=>CW/LW, scaleY=()=>CH/LH;

const CLR={bg:'#000814',player:'#00f5ff',enemy:'#ff2d78',ui:'#ffe600',
           green:'#39ff14',orange:'#ff8800',purple:'#bf00ff',dim:'#1e3a5f',cursor:'#39ff14'};

const DIFFS=[
  {label:'EASY',  color:'#39ff14', speedMult:0.7},
  {label:'MEDIUM',color:'#ff8800', speedMult:1.0},
  {label:'HARD',  color:'#ff2d78', speedMult:1.5},
];

// Grid layout — 13 rows (0=top homes, 12=start)
// Row 0: homes (5 lily pads)
// Rows 1-5: river (logs/turtles)
// Row 6: safe median strip (grass)
// Rows 7-11: road (cars)
// Row 12: safe starting strip

const ROWS=13, COLS=14;
const CELL=44;
const GRID_LEFT=(LW - COLS*CELL)/2;
const GRID_TOP=20;

const ROAD_ROW_START=7, ROAD_ROW_END=11;
const RIVER_ROW_START=1, RIVER_ROW_END=5;
const HOME_ROW=0;
const SAFE_ROW_MID=6;
const START_ROW=12;

// Lane configs
const LANE_CONFIGS=[
  // River lanes (rows 1-5) — logs and turtles
  {row:1, type:'log',   dir:1,  spd:1.0, obj:[{x:0},{x:4},{x:9}],    len:3},
  {row:2, type:'turtle',dir:-1, spd:1.2, obj:[{x:1},{x:5},{x:9},{x:12}],len:2},
  {row:3, type:'log',   dir:1,  spd:0.8, obj:[{x:0},{x:5},{x:10}],   len:4},
  {row:4, type:'log',   dir:-1, spd:1.1, obj:[{x:2},{x:7},{x:11}],   len:3},
  {row:5, type:'turtle',dir:1,  spd:0.9, obj:[{x:0},{x:4},{x:8},{x:12}],len:2},
  // Road lanes (rows 7-11) — cars
  {row:7,  type:'car', dir:-1, spd:2.0, obj:[{x:1},{x:6},{x:11}],   len:2},
  {row:8,  type:'car', dir:1,  spd:1.5, obj:[{x:0},{x:4},{x:9}],    len:2},
  {row:9,  type:'car', dir:-1, spd:1.8, obj:[{x:2},{x:7}],          len:3},
  {row:10, type:'car', dir:1,  spd:2.5, obj:[{x:0},{x:5},{x:10}],   len:2},
  {row:11, type:'car', dir:-1, spd:1.2, obj:[{x:1},{x:6},{x:11}],   len:2},
];

const HOME_POSITIONS=[1,3,5,7,9]; // column centers for homes (0-based, * CELL)

let gstate='MENU';
let diff=null;
let score=0, lives=3, level=1;
let frog={col:7,row:12,alive:true,onLog:null,onLogOff:0};
let homes=[false,false,false,false,false];
let lanes=[];
let particles=[], frameCount=0;
let moveTimer=0, timerCount=200;
let rawMX=CW/2,rawMY=CH/2,logMX=LW/2,logMY=LH/2;
const keys={}, keyQueue=[];
const BACK_BTN={x:10,y:LH-32,w:110,h:22};

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  rawMX=e.clientX-r.left; rawMY=e.clientY-r.top;
  logMX=rawMX/scaleX(); logMY=rawMY/scaleY();
});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gstate==='MENU'){
    if(e.code==='Digit1')startGame(0);
    if(e.code==='Digit2')startGame(1);
    if(e.code==='Digit3')startGame(2);
  }
  if((gstate==='DEAD'||gstate==='GAMEOVER'||gstate==='WIN')&&(e.code==='Enter'||e.code==='Space'))gstate='MENU';
  if(gstate==='PLAY'&&e.code==='Escape')gstate='MENU';
  if(gstate==='PLAY'){
    if(e.code==='ArrowUp'||e.code==='KeyW')    keyQueue.push('up');
    if(e.code==='ArrowDown'||e.code==='KeyS')  keyQueue.push('down');
    if(e.code==='ArrowLeft'||e.code==='KeyA')  keyQueue.push('left');
    if(e.code==='ArrowRight'||e.code==='KeyD') keyQueue.push('right');
  }
});
document.addEventListener('keyup',e=>{delete keys[e.code];});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/scaleX(), my=(e.clientY-r.top)/scaleY();
  if(inBackBtn(mx,my)){window.location.href='index.html';return;}
  if(gstate==='MENU')for(let i=0;i<3;i++)if(inDiffBtn(i,mx,my))startGame(i);
  if(gstate==='DEAD'||gstate==='GAMEOVER'||gstate==='WIN')gstate='MENU';
});

function inDiffBtn(i,mx,my){const bx=LW/2-160,by=270+i*62;return mx>=bx&&mx<=bx+320&&my>=by&&my<=by+48;}
function inBackBtn(mx,my){return mx>=BACK_BTN.x&&mx<=BACK_BTN.x+BACK_BTN.w&&my>=BACK_BTN.y&&my<=BACK_BTN.y+BACK_BTN.h;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function startGame(idx){
  diff=DIFFS[idx]; score=0; lives=3; level=1;
  homes=[false,false,false,false,false];
  setupLanes();
  resetFrog();
  gstate='PLAY';
}

function setupLanes(){
  lanes=LANE_CONFIGS.map(lc=>{
    const spd=(lc.spd*diff.speedMult*(level*0.15+0.85));
    return {
      ...lc, spd,
      objs: lc.obj.map(o=>({
        x: o.x * CELL + GRID_LEFT + rnd(0,20),
        width: lc.len * CELL - 6
      }))
    };
  });
}

function resetFrog(){
  frog={col:7, row:12, alive:true, onLog:null, onLogOff:0};
  timerCount=200-(level-1)*15;
  if(timerCount<60)timerCount=60;
  moveTimer=timerCount;
  keyQueue.length=0;
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const spd=rnd(1.5,5),a=rnd(0,Math.PI*2);
    particles.push({x,y,dx:Math.cos(a)*spd,dy:Math.sin(a)*spd,life:1.0,decay:rnd(0.02,0.06),r:rnd(2,6),color});
  }
}
function tickParticles(){
  particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dx*=0.93;p.dy*=0.93;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  particles.forEach(p=>{
    const r=p.r*p.life;if(r<=0)return;
    ctx.save();ctx.globalAlpha=p.life;ctx.shadowBlur=8;ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

function rowY(row){ return GRID_TOP + row * CELL; }
function colX(col){ return GRID_LEFT + col * CELL; }
function frogCX(){ return colX(frog.col)+CELL/2; }
function frogCY(){ return rowY(frog.row)+CELL/2; }

function drawBackground(){
  ctx.fillStyle=CLR.bg; ctx.fillRect(0,0,LW,LH);

  for(let row=0;row<ROWS;row++){
    const y=rowY(row), x=GRID_LEFT, w=COLS*CELL, h=CELL;
    if(row===HOME_ROW){
      ctx.fillStyle='#001a00'; ctx.fillRect(x,y,w,h);
    } else if(row>=RIVER_ROW_START&&row<=RIVER_ROW_END){
      ctx.fillStyle='#000c30'; ctx.fillRect(x,y,w,h);
      // Water shimmer
      ctx.fillStyle='rgba(0,50,150,0.15)';
      const wOff=(frameCount*0.5+row*20)%w;
      ctx.fillRect(x+wOff-w,y+2,w,4); ctx.fillRect(x+wOff,y+2,w,4);
    } else if(row===SAFE_ROW_MID||row===START_ROW){
      ctx.fillStyle='#002200'; ctx.fillRect(x,y,w,h);
    } else if(row>=ROAD_ROW_START&&row<=ROAD_ROW_END){
      ctx.fillStyle='#1a1a1a'; ctx.fillRect(x,y,w,h);
      // Dashed road lines
      ctx.save(); ctx.strokeStyle='#ffe60033'; ctx.lineWidth=1; ctx.setLineDash([8,12]);
      ctx.beginPath(); ctx.moveTo(x,y+h-1); ctx.lineTo(x+w,y+h-1); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
  }

  // Grid outer border
  ctx.save(); ctx.strokeStyle='#1e3a5f66'; ctx.lineWidth=1;
  ctx.strokeRect(GRID_LEFT,GRID_TOP,COLS*CELL,ROWS*CELL); ctx.restore();
}

function drawHomes(){
  HOME_POSITIONS.forEach((hCol,i)=>{
    const x=colX(hCol)+6, y=rowY(HOME_ROW)+6;
    const pad=CELL-12;
    ctx.save();
    ctx.fillStyle=homes[i]?CLR.green:'#003300';
    ctx.shadowBlur=homes[i]?16:4; ctx.shadowColor=CLR.green;
    ctx.beginPath(); ctx.roundRect(x,y,pad,pad,6); ctx.fill();
    if(homes[i]){
      // Frog on pad
      ctx.fillStyle='#00ff44';
      ctx.beginPath(); ctx.arc(x+pad/2,y+pad/2,8,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

function drawLanes(){
  lanes.forEach(lane=>{
    lane.objs.forEach(obj=>{
      const y=rowY(lane.row);
      if(lane.type==='log'){
        ctx.save(); ctx.fillStyle='#5a2d00'; ctx.shadowBlur=6; ctx.shadowColor='#ff8800';
        ctx.beginPath(); ctx.roundRect(obj.x,y+4,obj.width,CELL-8,4); ctx.fill();
        ctx.fillStyle='#7a3d10';
        ctx.fillRect(obj.x+4,y+8,obj.width-8,CELL-16);
        ctx.restore();
      } else if(lane.type==='turtle'){
        // Draw turtles
        const turtleW=CELL-8;
        ctx.save(); ctx.fillStyle='#006600'; ctx.shadowBlur=6; ctx.shadowColor=CLR.green;
        ctx.beginPath(); ctx.ellipse(obj.x+turtleW/2,y+CELL/2,turtleW/2,CELL/2-4,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#00aa00';
        ctx.beginPath(); ctx.ellipse(obj.x+turtleW/2,y+CELL/2,turtleW/3,CELL/3,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      } else if(lane.type==='car'){
        const carH=CELL-10;
        ctx.save(); ctx.fillStyle=lane.dir>0?CLR.orange:CLR.enemy;
        ctx.shadowBlur=10; ctx.shadowColor=lane.dir>0?CLR.orange:CLR.enemy;
        ctx.beginPath(); ctx.roundRect(obj.x,y+5,obj.width,carH,4); ctx.fill();
        // Windshield
        ctx.fillStyle='rgba(200,220,255,0.5)';
        const ws=lane.dir>0?obj.x+obj.width*0.5:obj.x+obj.width*0.1;
        ctx.fillRect(ws,y+8,obj.width*0.3,carH-6);
        // Headlights
        ctx.fillStyle=lane.dir>0?'#fff':'#ffff88';
        const hx=lane.dir>0?obj.x+obj.width-4:obj.x+1;
        ctx.fillRect(hx,y+8,3,5); ctx.fillRect(hx,y+carH-5,3,4);
        ctx.restore();
      }
    });
  });
}

function drawFrog(){
  if(!frog.alive)return;
  const fx=frogCX(), fy=frogCY();
  ctx.save();
  ctx.shadowBlur=16; ctx.shadowColor=CLR.purple; ctx.fillStyle=CLR.purple;
  // Body
  ctx.beginPath(); ctx.ellipse(fx,fy,10,9,0,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle=CLR.ui; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(fx-6,fy-5,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx+6,fy-5,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(fx-6,fy-5,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx+6,fy-5,2,0,Math.PI*2); ctx.fill();
  // Legs
  ctx.fillStyle=CLR.purple; ctx.shadowBlur=6; ctx.shadowColor=CLR.purple;
  ctx.fillRect(fx-16,fy+2,8,6); ctx.fillRect(fx+8,fy+2,8,6);  // back legs
  ctx.fillRect(fx-14,fy-6,7,5); ctx.fillRect(fx+7,fy-6,7,5);  // front legs
  ctx.restore();
}

function drawTimer(){
  const pct=moveTimer/timerCount;
  const barW=COLS*CELL;
  const barY=rowY(ROWS)+2;
  ctx.save();
  ctx.fillStyle='#1e3a5f'; ctx.fillRect(GRID_LEFT,barY,barW,6);
  const col=pct>0.5?CLR.green:pct>0.25?CLR.orange:CLR.enemy;
  ctx.fillStyle=col; ctx.shadowBlur=6; ctx.shadowColor=col;
  ctx.fillRect(GRID_LEFT,barY,barW*pct,6);
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.font='bold 18px Courier New'; ctx.textBaseline='top';
  ctx.textAlign='left'; ctx.fillStyle=CLR.ui; ctx.shadowBlur=12; ctx.shadowColor=CLR.ui;
  ctx.fillText(`SCORE: ${score}`,20,12);
  ctx.textAlign='right'; ctx.fillStyle=CLR.purple; ctx.shadowColor=CLR.purple;
  ctx.fillText(`LIVES: ${lives}`,LW-20,12);
  ctx.textAlign='center'; ctx.fillStyle=CLR.orange; ctx.shadowColor=CLR.orange;
  ctx.fillText(`LEVEL ${level}`,LW/2,12);
  if(diff){ctx.font='bold 12px Courier New'; ctx.fillStyle=diff.color; ctx.shadowColor=diff.color; ctx.fillText(diff.label,LW/2,34);}
  ctx.restore();
}

function drawScanlines(){
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#000';
  for(let y=0;y<LH;y+=3)ctx.fillRect(0,y,LW,1); ctx.restore();
}
function drawBackBtn(){
  const hov=inBackBtn(logMX,logMY);
  ctx.save(); ctx.font='bold 11px Courier New'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=hov?CLR.purple:CLR.dim; ctx.shadowBlur=hov?12:0; ctx.shadowColor=CLR.purple;
  ctx.fillText('← ARCADE',BACK_BTN.x,BACK_BTN.y+BACK_BTN.h/2); ctx.restore();
}
function drawCursor(cx,cy){
  const p=2,fg=CLR.cursor,dk=CLR.bg; ctx.save();
  ctx.translate(Math.round(cx),Math.round(cy)); ctx.shadowBlur=10; ctx.shadowColor=fg;
  const dot=(c,r,col=fg)=>{ctx.fillStyle=col;ctx.fillRect(c*p,r*p,p,p);};
  dot(-2,-6);dot(-2,-5);dot(1,-6);dot(1,-5);
  for(let c=-2;c<=2;c++)dot(c,-4);for(let c=-2;c<=2;c++)dot(c,-3);
  dot(-2,-2);dot(-1,-2,dk);dot(0,-2);dot(1,-2,dk);dot(2,-2);
  for(let c=-2;c<=2;c++)dot(c,-1);
  dot(-1,0);dot(0,0);dot(1,0);dot(0,1);
  for(let c=-1;c<=1;c++)dot(c,2);for(let c=-1;c<=1;c++)dot(c,3);for(let c=-1;c<=1;c++)dot(c,4);
  dot(-2,5);dot(-1,5);dot(1,5);dot(2,5);dot(2,3);dot(3,4);dot(3,5);dot(2,6);dot(2,7);
  ctx.restore();
}
function label(text,x,y,size,color,align='center'){
  ctx.save(); ctx.font=`bold ${size}px Courier New`; ctx.fillStyle=color;
  ctx.textAlign=align; ctx.textBaseline='middle'; ctx.shadowBlur=16; ctx.shadowColor=color;
  ctx.fillText(text,x,y); ctx.restore();
}

function updateGame(){
  frameCount++;

  // Move lanes
  lanes.forEach(lane=>{
    lane.objs.forEach(obj=>{
      obj.x+=lane.dir*lane.spd;
      // Wrap
      if(lane.dir>0&&obj.x>GRID_LEFT+COLS*CELL+20) obj.x=GRID_LEFT-obj.width-20;
      if(lane.dir<0&&obj.x+obj.width<GRID_LEFT-20)  obj.x=GRID_LEFT+COLS*CELL+20;
    });
  });

  // Timer
  moveTimer--;
  if(moveTimer<=0){
    killedBy('time'); return;
  }

  // Process queued moves
  if(keyQueue.length>0){
    const move=keyQueue.shift();
    let nc=frog.col, nr=frog.row;
    if(move==='up')    nr--;
    if(move==='down')  nr++;
    if(move==='left')  nc--;
    if(move==='right') nc++;
    nc=clamp(nc,0,COLS-1);
    nr=clamp(nr,0,ROWS-1);
    frog.col=nc; frog.row=nr;
    frog.onLog=null;
    score+=10; // move bonus
  }

  const fx=frogCX(), fy=frogCY();

  // River: check log/turtle riding
  if(frog.row>=RIVER_ROW_START&&frog.row<=RIVER_ROW_END){
    let onSomething=false;
    lanes.filter(l=>l.row===frog.row).forEach(lane=>{
      lane.objs.forEach(obj=>{
        if(fx>=obj.x&&fx<=obj.x+obj.width&&fy>=rowY(lane.row)&&fy<=rowY(lane.row)+CELL){
          // Ride with the log
          frog.col+=lane.dir*lane.spd/CELL;
          frog.col=clamp(frog.col,0,COLS-1);
          onSomething=true;
          frog.onLog=lane;
        }
      });
    });
    if(!onSomething){
      killedBy('water'); return;
    }
  }

  // Road: check car collision
  if(frog.row>=ROAD_ROW_START&&frog.row<=ROAD_ROW_END){
    lanes.filter(l=>l.row===frog.row).forEach(lane=>{
      lane.objs.forEach(obj=>{
        if(fx>obj.x&&fx<obj.x+obj.width&&fy>rowY(lane.row)+4&&fy<rowY(lane.row)+CELL-4){
          killedBy('car'); return;
        }
      });
    });
  }

  // Check out-of-bounds left/right (carried off by log)
  if(frogCX()<GRID_LEFT||frogCX()>GRID_LEFT+COLS*CELL){
    killedBy('water'); return;
  }

  // Check home
  if(frog.row===HOME_ROW){
    const hIdx=HOME_POSITIONS.indexOf(frog.col);
    if(hIdx>=0&&!homes[hIdx]){
      homes[hIdx]=true; score+=200;
      burst(frogCX(),frogCY(),CLR.green,20);
      if(homes.every(h=>h)){
        score+=500; nextLevel(); return;
      }
      resetFrog();
    } else if(hIdx<0||(hIdx>=0&&homes[hIdx])){
      // Hit bad home
      killedBy('water');
    }
  }

  tickParticles();
}

function killedBy(reason){
  burst(frogCX(),frogCY(),CLR.purple,20);
  lives--;
  if(lives<=0){gstate='GAMEOVER';return;}
  frog.alive=false;
  setTimeout(()=>{ if(gstate==='PLAY') resetFrog(); },800);
}

function nextLevel(){
  level++;
  homes=[false,false,false,false,false];
  setupLanes();
  resetFrog();
}

function drawMenu(){
  const grad=ctx.createRadialGradient(LW/2,LH/2,80,LW/2,LH/2,500);
  grad.addColorStop(0,'#0a0020'); grad.addColorStop(1,CLR.bg);
  ctx.fillStyle=grad; ctx.fillRect(0,0,LW,LH);
  ctx.save(); ctx.font='bold 88px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const pulse=0.8+0.2*Math.sin(Date.now()/600);
  ctx.shadowBlur=55*pulse; ctx.shadowColor=CLR.purple; ctx.fillStyle=CLR.purple;
  ctx.fillText('ROAD HOPPER',LW/2,120); ctx.restore();
  label('SELECT DIFFICULTY',LW/2,215,18,CLR.ui);
  DIFFS.forEach((d,i)=>{
    const bx=LW/2-160,by=270+i*62,bw=320,bh=48;
    const hov=inDiffBtn(i,logMX,logMY);
    ctx.save(); ctx.shadowBlur=hov?35:14; ctx.shadowColor=d.color;
    if(hov){ctx.fillStyle=d.color+'18';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.fill();}
    ctx.globalAlpha=hov?1:0.65; ctx.strokeStyle=d.color; ctx.lineWidth=hov?2.5:1.5;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha=hov?1:0.7;
    label(`${i+1}  ${d.label}`,LW/2,by+bh/2,hov?24:21,d.color);
    if(hov)label('▶',bx+18,by+bh/2,14,d.color);
    ctx.restore();
  });
  label('ARROWS/WASD TO HOP · FILL ALL 5 HOMES · ESC = MENU',LW/2,LH-22,12,CLR.dim);
  drawBackBtn(); drawScanlines();
}

function drawPlay(){
  drawBackground();
  drawHomes();
  drawLanes();
  drawFrog();
  drawParticles();
  drawTimer();
  drawHUD();
  drawBackBtn();
  drawScanlines();
}

function drawEnd(won){
  ctx.fillStyle='rgba(0,8,20,0.88)'; ctx.fillRect(0,0,LW,LH);
  drawParticles();
  const color=won?CLR.green:CLR.enemy;
  ctx.save(); ctx.font='bold 82px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const p=0.75+0.25*Math.sin(Date.now()/400);
  ctx.shadowBlur=65*p; ctx.shadowColor=color; ctx.fillStyle=color;
  ctx.fillText(won?'YOU MADE IT!':'ROAD KILL',LW/2,LH/2-60); ctx.restore();
  label(`SCORE: ${score}`,LW/2,LH/2+20,36,CLR.ui);
  label(`LEVEL REACHED: ${level}`,LW/2,LH/2+70,22,CLR.dim);
  const blink=Math.floor(Date.now()/550)%2===0;
  if(blink)label('CLICK OR ENTER TO CONTINUE',LW/2,LH/2+120,16,CLR.ui);
  drawBackBtn(); drawScanlines();
}

function loop(){
  ctx.clearRect(0,0,CW,CH);
  ctx.save(); ctx.scale(scaleX(),scaleY());
  if(gstate==='MENU')drawMenu();
  else if(gstate==='PLAY'){updateGame();drawPlay();}
  else if(gstate==='WIN'){tickParticles();drawEnd(true);}
  else if(gstate==='GAMEOVER'){tickParticles();drawEnd(false);}
  ctx.restore();
  drawCursor(rawMX,rawMY);
  requestAnimationFrame(loop);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();
  };
}

loop();
</script>
