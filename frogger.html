<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROAD HOPPER — ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000814; overflow: hidden; user-select: none; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const LW = 900, LH = 600;
let CW = 0, CH = 0;
function resize(){CW=canvas.width=window.innerWidth;CH=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();
const scaleX=()=>CW/LW, scaleY=()=>CH/LH;

const CLR={bg:'#000814',player:'#bf00ff',enemy:'#ff2d78',ui:'#ffe600',
           green:'#39ff14',orange:'#ff8800',purple:'#bf00ff',dim:'#1e3a5f',cursor:'#39ff14'};

const DIFFS=[
  {label:'EASY',   color:'#39ff14', initSpeed:0.35, maxSpeed:2.5, speedMult:0.7},
  {label:'MEDIUM', color:'#ff8800', initSpeed:0.65, maxSpeed:4.0, speedMult:1.0},
  {label:'HARD',   color:'#ff2d78', initSpeed:1.0,  maxSpeed:6.0, speedMult:1.5},
];

const CELL=50, COLS=18, ROWS_VISIBLE=12;

let gstate='MENU';
let diff=null;
let scrollPx=0, scrollSpeed=0;
let frogRow=2, frogColF=9.0;
let score=0, maxRow=0, lives=3;
let invincible=0;
let particles=[];
let frameCount=0;
let keyQueue=[];
let worldRows=new Map();
let generatedUpTo=0;
let rawMX=CW/2,rawMY=CH/2,logMX=LW/2,logMY=LH/2;
const keys={};
const BACK_BTN={x:10,y:LH-32,w:110,h:22};

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  rawMX=e.clientX-r.left;rawMY=e.clientY-r.top;
  logMX=rawMX/scaleX();logMY=rawMY/scaleY();
});

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gstate==='MENU'){
    if(e.code==='Digit1')startGame(0);
    if(e.code==='Digit2')startGame(1);
    if(e.code==='Digit3')startGame(2);
  }
  if(gstate==='GAMEOVER'&&(e.code==='Enter'||e.code==='Space'))gstate='MENU';
  if(gstate==='PLAY'&&e.code==='Escape')gstate='MENU';
  if(gstate==='PLAY'){
    if(e.code==='ArrowUp'||e.code==='KeyW')keyQueue.push('UP');
    if(e.code==='ArrowDown'||e.code==='KeyS')keyQueue.push('DOWN');
    if(e.code==='ArrowLeft'||e.code==='KeyA')keyQueue.push('LEFT');
    if(e.code==='ArrowRight'||e.code==='KeyD')keyQueue.push('RIGHT');
  }
});
document.addEventListener('keyup',e=>{delete keys[e.code];});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/scaleX(),my=(e.clientY-r.top)/scaleY();
  if(inBackBtn(mx,my)){window.location.href='index.html';return;}
  if(gstate==='MENU')for(let i=0;i<3;i++)if(inDiffBtn(i,mx,my))startGame(i);
  if(gstate==='GAMEOVER')gstate='MENU';
});

function inDiffBtn(i,mx,my){const bx=LW/2-160,by=270+i*62;return mx>=bx&&mx<=bx+320&&my>=by&&my<=by+48;}
function inBackBtn(mx,my){return mx>=BACK_BTN.x&&mx<=BACK_BTN.x+BACK_BTN.w&&my>=BACK_BTN.y&&my<=BACK_BTN.y+BACK_BTN.h;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function startGame(idx){
  diff=DIFFS[idx];
  scrollPx=0;
  scrollSpeed=diff.initSpeed;
  frogRow=2;frogColF=9.0;
  score=0;maxRow=0;lives=3;invincible=0;
  particles=[];keyQueue=[];
  worldRows=new Map();generatedUpTo=-1;
  frameCount=0;
  generateWorldUpTo(ROWS_VISIBLE+5);
  gstate='PLAY';
}

function generateRow(r){
  if(worldRows.has(r))return;
  let type,dir,spd,objs=[];
  if(r<3){type='GRASS';}
  else{
    const section=Math.floor(r/10);
    const pos=r%10;
    if(pos<2||pos===9)type='GRASS';
    else if(pos<6)type='ROAD';
    else if(pos===6)type='GRASS';
    else type='RIVER';
  }
  if(type==='ROAD'||type==='RIVER'){
    dir=(r%2===0)?1:-1;
    const section=Math.floor(r/10);
    const basespd=(1+section*0.12)*diff.speedMult+Math.random()*0.3;
    spd=basespd;
    if(type==='ROAD'){
      const n=3+Math.min(Math.floor(r/10),4);
      const w=CELL*2;
      const spacing=LW/n;
      for(let i=0;i<n;i++){
        objs.push({x:i*spacing+Math.random()*20,w:w});
      }
    } else {
      const n=3+Math.min(Math.floor(r/10),3);
      const w=CELL*3;
      const spacing=LW/n;
      for(let i=0;i<n;i++){
        objs.push({x:i*spacing+Math.random()*20,w:w});
      }
    }
  }
  worldRows.set(r,{type,dir:dir||1,spd:spd||1,objs});
}

function generateWorldUpTo(maxR){
  for(let r=generatedUpTo+1;r<=maxR;r++){
    generateRow(r);
  }
  if(maxR>generatedUpTo)generatedUpTo=maxR;
}

function rowScreenY(r){
  return LH-(r*CELL-scrollPx);
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    if(particles.length>=80)break;
    const spd=rnd(1.5,5),a=rnd(0,Math.PI*2);
    particles.push({x,y,dx:Math.cos(a)*spd,dy:Math.sin(a)*spd,life:1.0,decay:rnd(0.02,0.05),r:rnd(2,5),color});
  }
}
function tickParticles(){
  particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dx*=0.93;p.dy*=0.93;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  if(!particles.length)return;
  const byColor={};
  particles.forEach(p=>{if(!byColor[p.color])byColor[p.color]=[];byColor[p.color].push(p);});
  Object.entries(byColor).forEach(([col,ps])=>{
    ctx.save();ctx.shadowBlur=8;ctx.shadowColor=col;ctx.fillStyle=col;
    ps.forEach(p=>{const r=p.r*p.life;if(r>0){ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();}});
    ctx.restore();
  });
}

function die(){
  if(invincible>0)return;
  const fx=frogColF*CELL+CELL/2;
  const fy=rowScreenY(frogRow)+CELL/2;
  burst(fx,fy,CLR.purple,20);
  lives--;
  if(lives<=0){gstate='GAMEOVER';return;}
  invincible=120;
  const minRow=Math.floor(scrollPx/CELL)+1;
  frogRow=Math.max(frogRow,minRow+1);
  frogColF=9.0;
}

function updateGame(){
  frameCount++;

  // Scroll
  scrollPx+=scrollSpeed;
  if(scrollSpeed<diff.maxSpeed)scrollSpeed+=0.0002;

  // Generate new rows
  const topVisibleRow=Math.floor(scrollPx/CELL)+ROWS_VISIBLE+4;
  generateWorldUpTo(topVisibleRow);

  // Move lane objects
  worldRows.forEach((row,r)=>{
    if(row.type==='ROAD'||row.type==='RIVER'){
      row.objs.forEach(obj=>{
        obj.x+=row.dir*row.spd;
        if(obj.x>LW+obj.w)obj.x=-obj.w;
        if(obj.x<-obj.w)obj.x=LW+obj.w;
      });
    }
  });

  // Process one hop from key queue
  if(keyQueue.length>0){
    const hop=keyQueue.shift();
    if(hop==='UP'){
      frogRow++;
      if(frogRow>maxRow){maxRow=frogRow;score+=10;}
    } else if(hop==='DOWN'){
      const minRow=Math.floor(scrollPx/CELL)+1;
      frogRow=Math.max(frogRow-1,minRow);
    } else if(hop==='LEFT'){
      frogColF=Math.max(0,frogColF-1);
    } else if(hop==='RIGHT'){
      frogColF=Math.min(COLS-1,frogColF+1);
    }
  }

  // Check frog scrolled off bottom
  const frogScreenY=rowScreenY(frogRow);
  if(frogScreenY>LH+CELL/2){
    die();
    return;
  }

  // Check row hazards
  const row=worldRows.get(frogRow);
  if(row){
    if(row.type==='RIVER'){
      // Must be on a log
      const fx=frogColF*CELL+CELL/2;
      let onLog=false;
      for(const obj of row.objs){
        if(fx>=obj.x&&fx<=obj.x+obj.w){
          onLog=true;
          // Drift with log
          frogColF+=row.dir*row.spd/CELL;
          break;
        }
      }
      if(!onLog){die();return;}
      if(frogColF<0||frogColF>=COLS){die();return;}
    } else if(row.type==='ROAD'){
      // Check car collision
      const fx=frogColF*CELL+CELL/2;
      const fy=rowScreenY(frogRow)+CELL/2;
      for(const obj of row.objs){
        // Car occupies obj.x to obj.x+obj.w, vertically in the row
        if(fx>=obj.x-4&&fx<=obj.x+obj.w+4){
          die();return;
        }
      }
    }
  }

  if(invincible>0)invincible--;
  tickParticles();
}

let _sl=null;
function drawScanlines(){
  if(!_sl){_sl=document.createElement('canvas');_sl.width=LW;_sl.height=LH;const sc=_sl.getContext('2d');sc.fillStyle='rgba(0,0,0,0.05)';for(let y=0;y<LH;y+=3)sc.fillRect(0,y,LW,1);}
  ctx.drawImage(_sl,0,0);
}

function drawWorld(){
  // Draw rows that are visible
  const bottomRow=Math.max(0,Math.floor(scrollPx/CELL)-1);
  const topRow=Math.floor(scrollPx/CELL)+ROWS_VISIBLE+2;
  for(let r=bottomRow;r<=topRow;r++){
    const sy=rowScreenY(r);
    if(sy>LH+CELL||sy<-CELL)continue;
    const row=worldRows.get(r);
    if(!row)continue;
    drawRow(r,row,sy);
  }
}

function drawRow(r,row,sy){
  if(row.type==='GRASS'){
    ctx.fillStyle='#002200';
    ctx.fillRect(0,sy,LW,CELL);
    // Grass tufts
    ctx.fillStyle='#003300';
    for(let i=0;i<18;i++){
      const tx=(i*53+r*17)%LW;
      ctx.fillRect(tx,sy+CELL-8,3,8);
      ctx.fillRect(tx+2,sy+CELL-12,2,6);
    }
  } else if(row.type==='ROAD'){
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(0,sy,LW,CELL);
    // Lane dashes
    ctx.save();
    ctx.strokeStyle='#ffe60022';
    ctx.lineWidth=2;
    ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(0,sy+CELL/2);ctx.lineTo(LW,sy+CELL/2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    // Draw cars
    const carColor=row.dir>0?'#ff8800':'#ff2d78';
    ctx.save();
    ctx.fillStyle=carColor;ctx.shadowBlur=8;ctx.shadowColor=carColor;
    row.objs.forEach(obj=>{
      ctx.fillRect(obj.x,sy+6,obj.w,CELL-12);
      // Windshield
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.fillRect(obj.x+4,sy+8,obj.w-8,10);
      ctx.fillStyle=carColor;
      // Wheels
      ctx.shadowBlur=0;ctx.fillStyle='#333';
      ctx.beginPath();ctx.arc(obj.x+8,sy+CELL-8,5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(obj.x+obj.w-8,sy+CELL-8,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=carColor;ctx.shadowBlur=8;ctx.shadowColor=carColor;
    });
    ctx.restore();
  } else if(row.type==='RIVER'){
    ctx.fillStyle='#001840';
    ctx.fillRect(0,sy,LW,CELL);
    // Water shimmer
    ctx.save();
    ctx.fillStyle='rgba(0,60,120,0.3)';
    for(let i=0;i<9;i++){
      const wx=((i*90+frameCount*row.dir*0.5+r*30))%LW;
      ctx.fillRect(wx,sy+CELL*0.3,40,4);
    }
    ctx.restore();
    // Draw logs
    ctx.save();
    ctx.fillStyle='#663300';ctx.shadowBlur=6;ctx.shadowColor='#884400';
    row.objs.forEach(obj=>{
      ctx.beginPath();ctx.roundRect(obj.x,sy+8,obj.w,CELL-16,6);ctx.fill();
      // Wood grain
      ctx.fillStyle='#774400';
      ctx.fillRect(obj.x+4,sy+12,obj.w-8,3);
      ctx.fillRect(obj.x+4,sy+CELL-18,obj.w-8,3);
      ctx.fillStyle='#663300';ctx.shadowBlur=6;ctx.shadowColor='#884400';
    });
    ctx.restore();
  }
}

function drawFrog(){
  const fx=frogColF*CELL+CELL/2;
  const fy=rowScreenY(frogRow)+CELL/2;

  if(invincible>0&&Math.floor(frameCount/4)%2===0)return;

  ctx.save();
  // Body
  ctx.fillStyle=CLR.purple;ctx.shadowBlur=14;ctx.shadowColor=CLR.purple;
  ctx.beginPath();ctx.ellipse(fx,fy,10,8,0,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.shadowBlur=0;ctx.fillStyle=CLR.ui;
  ctx.beginPath();ctx.arc(fx-5,fy-6,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+5,fy-6,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(fx-5,fy-6,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(fx+5,fy-6,2,0,Math.PI*2);ctx.fill();
  // Legs
  ctx.strokeStyle=CLR.purple;ctx.lineWidth=3;ctx.shadowBlur=6;ctx.shadowColor=CLR.purple;
  ctx.beginPath();ctx.moveTo(fx-8,fy+2);ctx.lineTo(fx-16,fy+8);ctx.lineTo(fx-12,fy+14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(fx+8,fy+2);ctx.lineTo(fx+16,fy+8);ctx.lineTo(fx+12,fy+14);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.font='bold 18px Courier New';ctx.textBaseline='top';
  ctx.textAlign='left';ctx.fillStyle=CLR.ui;ctx.shadowBlur=12;ctx.shadowColor=CLR.ui;
  ctx.fillText(`SCORE: ${score}`,20,12);
  ctx.textAlign='right';ctx.fillStyle=CLR.enemy;ctx.shadowColor=CLR.enemy;
  ctx.fillText(`LIVES: ${lives}`,LW-20,12);
  ctx.textAlign='center';ctx.fillStyle=CLR.purple;ctx.shadowColor=CLR.purple;
  ctx.fillText(`DIST: ${maxRow}`,LW/2,12);
  if(diff){ctx.font='bold 12px Courier New';ctx.fillStyle=diff.color;ctx.shadowColor=diff.color;ctx.fillText(diff.label,LW/2,34);}
  ctx.restore();
  ctx.save();ctx.font='bold 10px Courier New';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillStyle=CLR.dim;ctx.fillText('ARROWS/WASD · HOP FORWARD BEFORE SCROLLED OFF',LW/2,LH-8);
  ctx.restore();
}

function drawBackBtn(){
  const hov=inBackBtn(logMX,logMY);
  ctx.save();ctx.font='bold 11px Courier New';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle=hov?CLR.purple:CLR.dim;ctx.shadowBlur=hov?12:0;ctx.shadowColor=CLR.purple;
  ctx.fillText('← ARCADE',BACK_BTN.x,BACK_BTN.y+BACK_BTN.h/2);ctx.restore();
}
function drawCursor(cx,cy){
  const p=2,fg=CLR.cursor,dk=CLR.bg;ctx.save();
  ctx.translate(Math.round(cx),Math.round(cy));ctx.shadowBlur=10;ctx.shadowColor=fg;
  const dot=(c,r,col=fg)=>{ctx.fillStyle=col;ctx.fillRect(c*p,r*p,p,p);};
  dot(-2,-6);dot(-2,-5);dot(1,-6);dot(1,-5);
  for(let c=-2;c<=2;c++)dot(c,-4);for(let c=-2;c<=2;c++)dot(c,-3);
  dot(-2,-2);dot(-1,-2,dk);dot(0,-2);dot(1,-2,dk);dot(2,-2);
  for(let c=-2;c<=2;c++)dot(c,-1);
  dot(-1,0);dot(0,0);dot(1,0);dot(0,1);
  for(let c=-1;c<=1;c++)dot(c,2);for(let c=-1;c<=1;c++)dot(c,3);for(let c=-1;c<=1;c++)dot(c,4);
  dot(-2,5);dot(-1,5);dot(1,5);dot(2,5);dot(2,3);dot(3,4);dot(3,5);dot(2,6);dot(2,7);
  ctx.restore();
}
function label(text,x,y,size,color,align='center'){
  ctx.save();ctx.font=`bold ${size}px Courier New`;ctx.fillStyle=color;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.shadowBlur=16;ctx.shadowColor=color;
  ctx.fillText(text,x,y);ctx.restore();
}

function drawMenu(){
  const grad=ctx.createRadialGradient(LW/2,LH/2,80,LW/2,LH/2,500);
  grad.addColorStop(0,'#0a0015');grad.addColorStop(1,CLR.bg);
  ctx.fillStyle=grad;ctx.fillRect(0,0,LW,LH);
  ctx.save();ctx.font='bold 78px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  const pulse=0.8+0.2*Math.sin(Date.now()/600);
  ctx.shadowBlur=55*pulse;ctx.shadowColor=CLR.purple;ctx.fillStyle=CLR.purple;
  ctx.fillText('ROAD HOPPER',LW/2,120);ctx.restore();
  label('SELECT DIFFICULTY',LW/2,215,18,CLR.ui);
  DIFFS.forEach((d,i)=>{
    const bx=LW/2-160,by=270+i*62,bw=320,bh=48;
    const hov=inDiffBtn(i,logMX,logMY);
    ctx.save();ctx.shadowBlur=hov?35:14;ctx.shadowColor=d.color;
    if(hov){ctx.fillStyle=d.color+'18';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.fill();}
    ctx.globalAlpha=hov?1:0.65;ctx.strokeStyle=d.color;ctx.lineWidth=hov?2.5:1.5;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.stroke();ctx.restore();
    ctx.save();ctx.globalAlpha=hov?1:0.7;
    label(`${i+1}  ${d.label}`,LW/2,by+bh/2,hov?24:21,d.color);
    if(hov)label('▶',bx+18,by+bh/2,14,d.color);
    ctx.restore();
  });
  label('ARROWS/WASD · HOP FORWARD · DON\'T GET SCROLLED OFF · ESC = MENU',LW/2,LH-22,12,CLR.dim);
  drawBackBtn();drawScanlines();
}

function drawPlay(){
  ctx.fillStyle=CLR.bg;ctx.fillRect(0,0,LW,LH);
  drawWorld();
  drawFrog();
  drawParticles();
  drawHUD();
  drawBackBtn();
  drawScanlines();
}

function drawGameover(){
  ctx.fillStyle='rgba(0,8,20,0.88)';ctx.fillRect(0,0,LW,LH);
  drawParticles();
  const p=0.75+0.25*Math.sin(Date.now()/400);
  ctx.save();ctx.font='bold 88px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowBlur=70*p;ctx.shadowColor=CLR.enemy;ctx.fillStyle=CLR.enemy;
  ctx.fillText('GAME OVER',LW/2,LH/2-60);ctx.restore();
  label(`SCORE: ${score}`,LW/2,LH/2+10,36,CLR.ui);
  label(`DISTANCE: ${maxRow}`,LW/2,LH/2+55,22,CLR.purple);
  if(diff)label(diff.label,LW/2,LH/2+95,18,diff.color);
  const blink=Math.floor(Date.now()/550)%2===0;
  if(blink)label('CLICK OR ENTER TO CONTINUE',LW/2,LH/2+135,16,CLR.ui);
  drawBackBtn();drawScanlines();
}

function loop(){
  frameCount++;
  ctx.clearRect(0,0,CW,CH);
  ctx.save();ctx.scale(scaleX(),scaleY());
  if(gstate==='MENU')drawMenu();
  else if(gstate==='PLAY'){updateGame();drawPlay();}
  else if(gstate==='GAMEOVER'){tickParticles();drawGameover();}
  ctx.restore();
  drawCursor(rawMX,rawMY);
  requestAnimationFrame(loop);
}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();
  };
}

loop();
</script>
</body>
</html>
