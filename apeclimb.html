<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APE CLIMB — ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000814; overflow: hidden; user-select: none; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const LW = 900, LH = 600;
let CW = 0, CH = 0;
function resize() { CW = canvas.width = window.innerWidth; CH = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
const scaleX = () => CW / LW;
const scaleY = () => CH / LH;

const CLR = { bg:'#000814', player:'#00f5ff', enemy:'#ff2d78', ui:'#ffe600',
              green:'#39ff14', orange:'#ff8800', purple:'#bf00ff', dim:'#1e3a5f', cursor:'#39ff14' };

const DIFFS = [
  { label:'ROOKIE',    color:'#39ff14', barrelSpd:1.8, spawnRate:180, msg:'Nice warm-up.' },
  { label:'VETERAN',   color:'#ff8800', barrelSpd:3.2, spawnRate:110, msg:'Solid run.'    },
  { label:'NIGHTMARE', color:'#ff2d78', barrelSpd:5.0, spawnRate:65,  msg:'INSANE.'       },
];

// ─── Layout ───────────────────────────────────────────────────────────────────
// Floors: y is the TOP of each beam. Player stands on floor y.
// floor 0 = bottom, floor 3 = top
const FLOORS = [
  { y: 510, x1:  60, x2: 840 },   // floor 0 — player starts here
  { y: 390, x1:  60, x2: 780 },   // floor 1
  { y: 270, x1: 120, x2: 840 },   // floor 2
  { y: 150, x1:  60, x2: 780 },   // floor 3 — gorilla up here
];

// Ladders: each connects floor[fromFloor] to floor[fromFloor+1]
const LADDERS = [
  { x: 200, fromFloor: 0 },   // left-ish
  { x: 640, fromFloor: 1 },   // right-ish
  { x: 300, fromFloor: 2 },   // mid-left
];

const LADDER_W = 24;
const PLAYER_W = 16, PLAYER_H = 24;
const BARREL_R = 10;
const GRAVITY = 0.6;
const JUMP_VEL = -13;

let gstate = 'MENU';
let diff = null;
let score = 0, lives = 3;
let particles = [];
let barrels = [];
let spawnTimer = 0;
let frameCount = 0;

let player = { x:0, y:0, vx:0, vy:0, onGround:false, onLadder:false,
               floorIdx:0, facingRight:true, invincible:0 };
let gorillaThrow = 0;

let rawMX = CW/2, rawMY = CH/2, logMX = LW/2, logMY = LH/2;
const keys = {};
const BACK_BTN = { x:10, y:LH-32, w:110, h:22 };

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  rawMX = e.clientX - r.left; rawMY = e.clientY - r.top;
  logMX = rawMX / scaleX(); logMY = rawMY / scaleY();
});
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gstate === 'MENU') {
    if (e.code === 'Digit1') startGame(0);
    if (e.code === 'Digit2') startGame(1);
    if (e.code === 'Digit3') startGame(2);
  }
  if ((gstate === 'WIN' || gstate === 'GAMEOVER') && (e.code === 'Enter' || e.code === 'Space')) gstate = 'MENU';
  if (gstate === 'PLAY' && e.code === 'Escape') gstate = 'MENU';
});
document.addEventListener('keyup', e => { delete keys[e.code]; });

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / scaleX();
  const my = (e.clientY - r.top) / scaleY();
  if (inBackBtn(mx, my)) { window.location.href = 'index.html'; return; }
  if (gstate === 'MENU') {
    for (let i = 0; i < 3; i++) { if (inDiffBtn(i, mx, my)) startGame(i); }
  }
  if (gstate === 'WIN' || gstate === 'GAMEOVER') gstate = 'MENU';
});

function inDiffBtn(i, mx, my) {
  const bx = LW/2-160, by = 270 + i*62;
  return mx >= bx && mx <= bx+320 && my >= by && my <= by+48;
}
function inBackBtn(mx, my) {
  return mx >= BACK_BTN.x && mx <= BACK_BTN.x+BACK_BTN.w &&
         my >= BACK_BTN.y && my <= BACK_BTN.y+BACK_BTN.h;
}

const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi,v));

function startGame(idx) {
  diff = DIFFS[idx]; score = 0; lives = 3;
  barrels = []; particles = []; spawnTimer = 0;
  resetPlayer();
  gstate = 'PLAY';
}

function resetPlayer() {
  const f = FLOORS[0];
  player.x = f.x1 + 40;
  player.y = f.y - PLAYER_H;
  player.vx = 0; player.vy = 0;
  player.onGround = true; player.onLadder = false;
  player.floorIdx = 0; player.invincible = 90;
}

// ─── Pixel Sprite ─────────────────────────────────────────────────────────────
function drawSprite(map, x, y, px, color) {
  ctx.fillStyle = color;
  for (let r = 0; r < map.length; r++) {
    for (let c = 0; c < map[r].length; c++) {
      if (map[r][c] !== ' ') {
        ctx.fillRect(x + c*px, y + r*px, px, px);
      }
    }
  }
}

const GORILLA_SPRITE = [
  ' XXXXX ',
  'XXXXXXX',
  'X X X X',
  'XXXXXXX',
  ' XXXXX ',
  'XX   XX',
  'X     X',
];

const PLAYER_SPRITE_R = [
  ' XX ',
  'XXXX',
  ' XX ',
  'X  X',
  'X  X',
];

const PLAYER_SPRITE_L = [
  ' XX ',
  'XXXX',
  ' XX ',
  'X  X',
  'X  X',
];

function drawGorilla() {
  const f3 = FLOORS[3];
  const gx = f3.x2 - 60, gy = f3.y - 56;
  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = CLR.orange;
  drawSprite(GORILLA_SPRITE, gx, gy, 8, CLR.orange);
  // animate throw
  if (gorillaThrow > 0) {
    ctx.fillStyle = CLR.enemy;
    ctx.shadowColor = CLR.enemy;
    ctx.beginPath();
    ctx.arc(gx - 16, gy + 16, 8, 0, Math.PI*2);
    ctx.fill();
    gorillaThrow--;
  }
  ctx.restore();
}

function drawPlayerSprite() {
  if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;
  ctx.save();
  ctx.shadowBlur = 14; ctx.shadowColor = CLR.player;
  const sprite = player.facingRight ? PLAYER_SPRITE_R : PLAYER_SPRITE_L;
  drawSprite(sprite, player.x, player.y, 5, CLR.player);
  ctx.restore();
}

function drawPlatforms() {
  FLOORS.forEach((f, i) => {
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = CLR.orange + '88';
    ctx.fillStyle = '#331100';
    ctx.fillRect(f.x1, f.y, f.x2 - f.x1, 12);
    ctx.shadowBlur = 6; ctx.shadowColor = CLR.orange;
    ctx.fillStyle = CLR.orange;
    ctx.fillRect(f.x1, f.y, f.x2 - f.x1, 3);
    ctx.fillRect(f.x1, f.y + 9, f.x2 - f.x1, 3);
    ctx.restore();
    // rivets
    ctx.fillStyle = '#ff880066';
    for (let rx = f.x1 + 20; rx < f.x2; rx += 40) {
      ctx.fillRect(rx, f.y + 4, 4, 4);
    }
  });
}

function drawLadders() {
  LADDERS.forEach(l => {
    const f1 = FLOORS[l.fromFloor];
    const f2 = FLOORS[l.fromFloor + 1];
    const lx = l.x;
    const y1 = f2.y + 12;
    const y2 = f1.y;
    ctx.save();
    ctx.shadowBlur = 6; ctx.shadowColor = '#ffcc44';
    ctx.strokeStyle = '#ffcc44'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, y1); ctx.lineTo(lx, y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx + LADDER_W, y1); ctx.lineTo(lx + LADDER_W, y2); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = '#aa8822';
    for (let y = y2; y > y1; y -= 18) {
      ctx.beginPath(); ctx.moveTo(lx, y); ctx.lineTo(lx + LADDER_W, y); ctx.stroke();
    }
    ctx.restore();
  });
}

function drawBarrels() {
  barrels.forEach(b => {
    const angle = b.x * 0.05;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(angle * b.dir);
    ctx.shadowBlur = 14; ctx.shadowColor = CLR.enemy;
    ctx.fillStyle = CLR.enemy;
    ctx.beginPath(); ctx.arc(0, 0, BARREL_R, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff000044';
    ctx.beginPath(); ctx.arc(0, 0, BARREL_R - 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffaaaa'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke();
    ctx.restore();
  });
}

function drawHUD() {
  ctx.save();
  ctx.font = 'bold 18px Courier New';
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = CLR.ui; ctx.shadowBlur = 12; ctx.shadowColor = CLR.ui;
  ctx.fillText(`SCORE: ${score}`, 20, 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = CLR.orange; ctx.shadowColor = CLR.orange;
  ctx.fillText(`LIVES: ${lives}`, LW - 20, 12);
  if (diff) {
    ctx.textAlign = 'center';
    ctx.fillStyle = diff.color; ctx.shadowColor = diff.color;
    ctx.font = 'bold 13px Courier New';
    ctx.fillText(diff.label, LW/2, 12);
  }
  ctx.restore();
}

function drawScanlines() {
  ctx.save(); ctx.globalAlpha = 0.04; ctx.fillStyle = '#000';
  for (let y = 0; y < LH; y += 3) ctx.fillRect(0, y, LW, 1);
  ctx.restore();
}

function drawBackBtn() {
  const hov = inBackBtn(logMX, logMY);
  ctx.save();
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = hov ? CLR.orange : CLR.dim;
  ctx.shadowBlur = hov ? 12 : 0; ctx.shadowColor = CLR.orange;
  ctx.fillText('← ARCADE', BACK_BTN.x, BACK_BTN.y + BACK_BTN.h/2);
  ctx.restore();
}

function drawCursor(cx, cy) {
  const p = 2, fg = CLR.cursor, dk = CLR.bg;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  ctx.shadowBlur = 10; ctx.shadowColor = fg;
  const dot = (c, r, col = fg) => { ctx.fillStyle = col; ctx.fillRect(c*p, r*p, p, p); };
  dot(-2,-6); dot(-2,-5); dot(1,-6); dot(1,-5);
  for(let c=-2;c<=2;c++) dot(c,-4);
  for(let c=-2;c<=2;c++) dot(c,-3);
  dot(-2,-2); dot(-1,-2,dk); dot(0,-2); dot(1,-2,dk); dot(2,-2);
  for(let c=-2;c<=2;c++) dot(c,-1);
  dot(-1,0); dot(0,0); dot(1,0); dot(0,1);
  for(let c=-1;c<=1;c++) dot(c,2);
  for(let c=-1;c<=1;c++) dot(c,3);
  for(let c=-1;c<=1;c++) dot(c,4);
  dot(-2,5); dot(-1,5); dot(1,5); dot(2,5);
  dot(2,3); dot(3,4); dot(3,5); dot(2,6); dot(2,7);
  ctx.restore();
}

function label(text, x, y, size, color, align = 'center') {
  ctx.save();
  ctx.font = `bold ${size}px Courier New`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowBlur = 16; ctx.shadowColor = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// ─── Burst ────────────────────────────────────────────────────────────────────
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const spd = rnd(1.5,5), a = rnd(0, Math.PI*2);
    particles.push({x,y, dx:Math.cos(a)*spd, dy:Math.sin(a)*spd,
                    life:1.0, decay:rnd(0.02,0.05), r:rnd(2,5), color});
  }
}
function tickParticles() {
  particles.forEach(p => { p.x+=p.dx; p.y+=p.dy; p.dx*=0.93; p.dy*=0.93; p.life-=p.decay; });
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  particles.forEach(p => {
    const r = p.r * p.life; if(r<=0) return;
    ctx.save(); ctx.globalAlpha = p.life; ctx.shadowBlur = 8; ctx.shadowColor = p.color;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ─── Ladder overlap detection ─────────────────────────────────────────────────
function getOverlappingLadder() {
  const pcx = player.x + PLAYER_W/2;
  for (const l of LADDERS) {
    const f1 = FLOORS[l.fromFloor];
    const f2 = FLOORS[l.fromFloor + 1];
    if (pcx >= l.x - 2 && pcx <= l.x + LADDER_W + 2 &&
        player.y + PLAYER_H >= f2.y && player.y <= f1.y) {
      return l;
    }
  }
  return null;
}

// ─── Floor collision ──────────────────────────────────────────────────────────
function snapToFloor(f) {
  player.y = f.y - PLAYER_H;
  player.vy = 0;
  player.onGround = true;
}

function getFloorBelow() {
  let best = null, bestDist = Infinity;
  FLOORS.forEach((f, i) => {
    const playerBottom = player.y + PLAYER_H;
    const dist = f.y - playerBottom;
    const pcx = player.x + PLAYER_W/2;
    if (dist >= -2 && dist < 40 && pcx >= f.x1 && pcx <= f.x2) {
      if (dist < bestDist) { bestDist = dist; best = { f, i }; }
    }
  });
  return best;
}

function isOnFloor(f) {
  const playerBottom = player.y + PLAYER_H;
  const pcx = player.x + PLAYER_W/2;
  return Math.abs(playerBottom - f.y) < 4 && pcx >= f.x1 && pcx <= f.x2;
}

// ─── Update ───────────────────────────────────────────────────────────────────
function updateGame() {
  frameCount++;
  const ladder = getOverlappingLadder();
  const up    = keys['ArrowUp']   || keys['KeyW'];
  const down  = keys['ArrowDown'] || keys['KeyS'];
  const left  = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight']|| keys['KeyD'];
  const jump  = keys['Space'] || up;

  // Ladder logic
  if (ladder && (up || down)) {
    player.onLadder = true;
  }
  if (!ladder) player.onLadder = false;

  if (player.onLadder && ladder) {
    player.vx = 0;
    player.vy = 0;
    if (up)   player.y -= 2.5;
    if (down) player.y += 2.5;
    player.onGround = false;

    // Snap to ladder x
    player.x = ladder.x + LADDER_W/2 - PLAYER_W/2;

    // Check if we reached top floor
    const f2 = FLOORS[ladder.fromFloor + 1];
    if (player.y + PLAYER_H <= f2.y + 4) {
      // Landed on upper floor
      player.y = f2.y - PLAYER_H;
      player.onLadder = false; player.onGround = true;
    }
    // Check if we went down to lower floor
    const f1 = FLOORS[ladder.fromFloor];
    if (player.y + PLAYER_H >= f1.y + 6) {
      player.y = f1.y - PLAYER_H;
      player.onLadder = false; player.onGround = true;
    }
  } else {
    // Horizontal movement
    if (left)  { player.vx = -3.5; player.facingRight = false; }
    else if (right) { player.vx = 3.5; player.facingRight = true; }
    else player.vx = 0;

    // Jump
    if ((keys['Space'] || (up && player.onGround)) && player.onGround) {
      player.vy = JUMP_VEL;
      player.onGround = false;
    }

    // Gravity
    if (!player.onGround) player.vy += GRAVITY;

    player.x += player.vx;
    player.y += player.vy;

    // Floor collision
    player.onGround = false;
    FLOORS.forEach(f => {
      const pcx = player.x + PLAYER_W/2;
      if (pcx >= f.x1 && pcx <= f.x2) {
        if (player.y + PLAYER_H >= f.y && player.y + PLAYER_H <= f.y + 14 && player.vy >= 0) {
          snapToFloor(f);
        }
      }
    });

    // Floor boundaries (horizontal)
    FLOORS.forEach(f => {
      if (isOnFloor(f)) {
        player.x = clamp(player.x, f.x1, f.x2 - PLAYER_W);
      }
    });
  }

  // Top / bottom bounds
  player.y = clamp(player.y, 40, LH - PLAYER_H);
  if (player.y >= LH - PLAYER_H) {
    // Fell off — reset
    loseLife();
  }

  // Check win (reached floor 3)
  const f3 = FLOORS[3];
  const pcx = player.x + PLAYER_W/2;
  if (isOnFloor(f3) && pcx > f3.x1 + 10) {
    score += 5000;
    gstate = 'WIN';
    return;
  }

  // Spawn barrels
  spawnTimer++;
  if (spawnTimer >= diff.spawnRate) {
    spawnTimer = 0;
    const f3 = FLOORS[3];
    barrels.push({ x: f3.x2 - 70, y: f3.y - BARREL_R - 3, vy: 0,
                   floor: 3, dir: -1, spd: diff.barrelSpd });
    gorillaThrow = 18;
  }

  // Update barrels
  barrels = barrels.filter(b => {
    b.x += b.dir * b.spd;
    b.vy += GRAVITY * 0.5;
    b.y += b.vy;

    // Floor bounce/transition
    FLOORS.forEach((f, fi) => {
      if (b.y + BARREL_R >= f.y && b.y < f.y + 16 && b.vy > 0) {
        b.y = f.y - BARREL_R;
        b.vy = 0;
        b.floor = fi;
        // Reverse at edges
        if (b.x < f.x1 + 10 && b.dir < 0) {
          if (fi > 0) { b.floor = fi - 1; b.vy = 2; } else b.dir = 1;
        }
        if (b.x > f.x2 - 10 && b.dir > 0) {
          if (fi > 0) { b.floor = fi - 1; b.vy = 2; } else b.dir = -1;
        }
      }
    });

    // Reverse direction based on floor boundaries
    const cf = FLOORS[b.floor];
    if (b.floor >= 0 && cf) {
      if (b.x < cf.x1 + 5 && b.dir < 0) {
        if (b.floor > 0) { b.vy = 3; }
        else { b.dir = 1; }
      }
      if (b.x > cf.x2 - 5 && b.dir > 0) {
        if (b.floor > 0) { b.vy = 3; }
        else { b.dir = -1; }
      }
    }

    // Off screen removal
    if (b.x < -30 || b.x > LW + 30 || b.y > LH + 30) return false;

    // Collision with player
    if (player.invincible <= 0) {
      const dx = (player.x + PLAYER_W/2) - b.x;
      const dy = (player.y + PLAYER_H/2) - b.y;
      if (Math.sqrt(dx*dx + dy*dy) < BARREL_R + PLAYER_W/2) {
        burst(b.x, b.y, CLR.enemy, 16);
        loseLife();
        return false;
      }
    }

    // Score for jumping over barrel
    if (b.y + BARREL_R < player.y - 2 && b.x > player.x - 10 && b.x < player.x + PLAYER_W + 10) {
      // Only score once per barrel — tag it
      if (!b.scored) { b.scored = true; score += 100; }
    }

    return true;
  });

  if (player.invincible > 0) player.invincible--;
  tickParticles();
}

function loseLife() {
  lives--;
  burst(player.x + PLAYER_W/2, player.y + PLAYER_H/2, CLR.player, 20);
  if (lives <= 0) { gstate = 'GAMEOVER'; return; }
  resetPlayer();
}

// ─── Draw ──────────────────────────────────────────────────────────────────────
function drawMenu() {
  const grad = ctx.createRadialGradient(LW/2, LH/2, 80, LW/2, LH/2, 500);
  grad.addColorStop(0, '#110500'); grad.addColorStop(1, CLR.bg);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, LW, LH);

  ctx.save();
  ctx.font = 'bold 96px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const pulse = 0.8 + 0.2 * Math.sin(Date.now()/600);
  ctx.shadowBlur = 55 * pulse; ctx.shadowColor = CLR.orange; ctx.fillStyle = CLR.orange;
  ctx.fillText('APE CLIMB', LW/2, 130);
  ctx.restore();
  label('SELECT DIFFICULTY', LW/2, 230, 18, CLR.ui);
  DIFFS.forEach((d, i) => {
    const bx = LW/2-160, by = 270+i*62, bw = 320, bh = 48;
    const hov = inDiffBtn(i, logMX, logMY);
    ctx.save();
    ctx.shadowBlur = hov ? 35 : 14; ctx.shadowColor = d.color;
    if (hov) { ctx.fillStyle = d.color+'18'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.fill(); }
    ctx.globalAlpha = hov ? 1.0 : 0.65; ctx.strokeStyle = d.color; ctx.lineWidth = hov ? 2.5 : 1.5;
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha = hov ? 1.0 : 0.7;
    label(`${i+1}  ${d.label}`, LW/2, by+bh/2, hov ? 24 : 21, d.color);
    if (hov) label('▶', bx+18, by+bh/2, 14, d.color);
    ctx.restore();
  });
  label('ARROWS/WASD · SPACE TO JUMP · ESC = MENU', LW/2, LH-22, 12, CLR.dim);
  drawBackBtn(); drawScanlines();
}

function drawPlay() {
  ctx.fillStyle = CLR.bg; ctx.fillRect(0, 0, LW, LH);
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, LH);
  grad.addColorStop(0, '#000814'); grad.addColorStop(1, '#110500');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, LW, LH);

  drawPlatforms();
  drawLadders();
  drawGorilla();
  drawBarrels();
  drawPlayerSprite();
  drawParticles();
  drawHUD();
  // Reach top indicator
  ctx.save();
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = CLR.orange + '88'; ctx.shadowBlur = 0;
  ctx.fillText('REACH THE TOP!', LW/2, FLOORS[3].y - 20);
  ctx.restore();
  drawBackBtn(); drawScanlines();
}

function drawEndScreen(won) {
  ctx.fillStyle = 'rgba(0,8,20,0.88)'; ctx.fillRect(0, 0, LW, LH);
  drawParticles();
  const color = won ? CLR.orange : CLR.enemy;
  ctx.save();
  ctx.font = 'bold 82px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const p = 0.75 + 0.25 * Math.sin(Date.now()/400);
  ctx.shadowBlur = 65*p; ctx.shadowColor = color; ctx.fillStyle = color;
  ctx.fillText(won ? 'YOU ESCAPED!' : 'GAME OVER', LW/2, LH/2 - 60);
  ctx.restore();
  label(`SCORE: ${score}`, LW/2, LH/2 + 20, 36, CLR.ui);
  const blink = Math.floor(Date.now()/550)%2===0;
  if (blink) label('CLICK OR ENTER TO CONTINUE', LW/2, LH/2+100, 16, CLR.ui);
  drawBackBtn(); drawScanlines();
}

function loop() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.save(); ctx.scale(scaleX(), scaleY());
  if      (gstate === 'MENU')     drawMenu();
  else if (gstate === 'PLAY')     { updateGame(); drawPlay(); }
  else if (gstate === 'WIN')      { tickParticles(); drawEndScreen(true); }
  else if (gstate === 'GAMEOVER') { tickParticles(); drawEndScreen(false); }
  ctx.restore();
  drawCursor(rawMX, rawMY);
  requestAnimationFrame(loop);
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    r=Math.min(r,w/2,h/2); this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath();
  };
}

loop();
</script>
